<!-- @dsCard group="Components" viewport="700x220" name="Buttons" subtitle="Flat, hairline, small radius — primary / secondary / ghost / destructive" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-ui);padding:22px;display:flex;flex-direction:column;gap:18px}
  .grp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .cap{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);letter-spacing:var(--tr-label);width:90px}
  .btn{font-family:var(--font-ui);font-size:14px;font-weight:500;padding:11px 20px;border-radius:var(--r-input);border:1px solid var(--line-2);cursor:pointer}
  .primary{background:var(--surface-3);color:var(--text-hi);border-color:var(--line-2)}
  .secondary{background:var(--surface-1);color:var(--text-mid)}
  .ghost{background:transparent;color:var(--text-mid);border-color:transparent}
  .destructive{background:transparent;color:var(--danger);border-color:var(--danger-dim)}
  .disabled{background:var(--surface-1);color:var(--text-faint);border-color:var(--line-1);cursor:not-allowed}
  .sm{font-size:12px;padding:8px 14px}
</style>
</head>
<body>
  <div class="grp"><span class="cap">PRIMARY</span>
    <button class="btn primary">출정 시작</button>
    <button class="btn secondary">취소</button>
    <button class="btn ghost">더보기</button>
    <button class="btn disabled">잠김</button>
  </div>
  <div class="grp"><span class="cap">DESTRUCTIVE</span>
    <button class="btn destructive">수리 진행</button>
    <button class="btn destructive">장비 파괴</button>
  </div>
  <div class="grp"><span class="cap">SMALL</span>
    <button class="btn primary sm">착용</button>
    <button class="btn secondary sm">판매</button>
    <button class="btn ghost sm">해제</button>
  </div>
</body>
</html>
