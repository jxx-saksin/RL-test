<style>

  body{background:var(--bg-void);color:var(--text-hi);font-family:var(--font-ui);padding:24px 20px;display:flex;justify-content:center}
  .nav{width:390px;background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-card);display:flex;padding:8px 6px;box-shadow:var(--shadow-sticky)}
  .item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;position:relative;color:var(--text-lo)}
  .item.on{color:var(--text-hi)}
  .item.on::before{content:"";position:absolute;top:0;width:20px;height:2px;border-radius:var(--r-pill);background:var(--text-hi)}
  .item i{width:20px;height:20px}
  .item svg{width:20px;height:20px;stroke-width:1.75}
  .lbl{font-size:10.5px;font-weight:500}
