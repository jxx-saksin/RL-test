<!-- @dsCard group="Components" viewport="700x360" name="List — single-line items" subtitle="Dense inventory rows: category tag + name + trailing value, one line each" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-void);color:var(--text-hi);font-family:var(--font-ui);padding:20px;display:flex;justify-content:center}
  .list{width:380px;background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-card);overflow:hidden}
  .sec{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);letter-spacing:var(--tr-label);padding:11px 15px 7px;background:var(--bg-base)}
  .row{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 15px;border-top:1px solid var(--line-1)}
  .row:first-of-type{border-top:0}
  .cat{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;color:var(--text-mid);background:var(--surface-2);border:1px solid var(--line-1);border-radius:var(--r-chip);padding:3px 7px;flex:0 0 auto}
  .cat .dot{width:5px;height:5px;border-radius:var(--r-pill);background:var(--text-lo);flex:0 0 auto}
  .nm{font-size:14px;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .qty{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);flex:0 0 auto}
  .val{font-family:var(--font-mono);font-size:12.5px;color:var(--text-mid);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
  .val.asset{color:var(--sato)}
</style>
</head>
<body>
  <div class="list">
    <div class="sec">인벤토리 · 24점</div>
    <div class="row"><span class="cat"><span class="dot"></span>무기</span><span class="nm">녹슨 기어 철퇴</span><span class="val">18–34</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>갑옷</span><span class="nm">방수 작업복</span><span class="val">방어 12</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>투구</span><span class="nm">용접 마스크</span><span class="val">방어 7</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>음식</span><span class="nm">비상식량</span><span class="qty">×4</span><span class="val">STA +8</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>약품</span><span class="nm">응급키트</span><span class="qty">×3</span><span class="val">HP +40</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>키</span><span class="nm">하수도 카드키</span><span class="val">잠금 해제</span></div>
    <div class="row"><span class="cat"><span class="dot"></span>정크</span><span class="nm">부러진 회로판</span><span class="val asset">24</span></div>
  </div>
</body>
</html>
