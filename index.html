(id){ return byId.item[id]||byId.weapon[id]||byId.armor[id]||null; }\nexport function anyName(id){ const o=anyItem(id); return o? (o.ItemName_KR||o.WeaponName_KR||o.ArmorName_KR||id) : id; }\n",
  sl: "// Live Google-Sheets loader for the RL prototype.\n// Fetches each tab as CSV from the shared sheet, parses, and shapes it into\n// the same structure as the bundled data/game-data.js. CORS-enabled via the\n// gviz endpoint (works for link-shared sheets).\n\nexport const SHEET_ID = '1d-LNhcuFo1dKO1zzszDNAXXT-zDqffatr1aCe3yB8ls';\nexport const TABS = ['Config','PrimaryStat','SecondaryStat','StatusEffect','WeaponAttribute',\n  'Weapon','Armor','Item','Monster','City','Zone','Vendor','Shop','LootTable','Artifact','Affix'];\n\n// --- RFC4180-ish CSV parser (handles quoted commas + newlines) ---\nexport function parseCSV(text) {\n  const rows = []; let row = [], field = '', i = 0, inq = false;\n  while (i < text.length) {\n    const c = text[i];\n    if (inq) {\n      if (c === '\"') { if (text[i + 1] === '\"') { field += '\"'; i += 2; continue; } inq = false; i++; continue; }\n      field += c; i++; continue;\n    }\n    if (c === '\"') { inq = true; i++; continue; }\n    if (c === ',') { row.push(field); field = ''; i++; continue; }\n    if (c === '\\r') { i++; continue; }\n    if (c === '\\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }\n    field += c; i++;\n  }\n  if (field.length || row.length) { row.push(field); rows.push(row); }\n  return rows;\n}\n\n// Stable gid map for this workbook (fallback if live discovery fails).\nexport const GIDS = {\n  Config:'618819984', PrimaryStat:'1912326207', SecondaryStat:'1392044965', WeaponAttribute:'1086480785',\n  StatusEffect:'669993744', Affix:'1902981873', Artifact:'876429288', Shop:'543913112', Item:'799451703',\n  City:'1696147459', Zone:'761789751', Vendor:'259794886', Monster:'1464124612', Weapon:'1482785136',\n  Armor:'540890839', All_IDs:'220464388', LootTable:'290666291'\n};\n\n// Discover the name->gid map live (so added/renamed tabs still work); fall back to GIDS.\nexport async function fetchGidMap(id = SHEET_ID) {\n  try {\n    const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/htmlview?_=${Date.now()}`, { mode:'cors', cache:'no-store' });\n    const t = await r.text();\n    const map = {};\n    for (const m of t.matchAll(/\\{name:\\s*\"([^\"]+)\",\\s*pageUrl:\\s*\"([^\"]+)\"/g)) {\n      const gid = (m[2].match(/gid=(\\d+)/) || [])[1];\n      if (gid) map[m[1]] = gid;\n    }\n    return Object.keys(map).length ? { ...GIDS, ...map } : { ...GIDS };\n  } catch (_) { return { ...GIDS }; }\n}\n\n// /export?format=csv exports DISPLAYED values verbatim (no per-column type inference,\n// unlike gviz which nulls text cells in a numeric column). &_=<ts> busts caches.\nfunction tabUrl(id, gid) {\n  return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}&_=${Date.now()}`;\n}\n\n// fetch every tab in parallel -> { tabName: rows[][] }\nexport async function fetchAllTabs(id = SHEET_ID) {\n  const gidMap = await fetchGidMap(id);\n  const out = {};\n  await Promise.all(TABS.map(async tab => {\n    const gid = gidMap[tab];\n    if (gid == null) return;\n    const r = await fetch(tabUrl(id, gid), { mode: 'cors', cache: 'no-store' });\n    if (!r.ok) throw new Error(tab + ' HTTP ' + r.status);\n    out[tab] = parseCSV(await r.text());\n  }));\n  return out;\n}\n\n// --- shape raw rows into DATA (mirrors data/game-data.js generator) ---\nconst coerce = v => (v !== '' && v != null && !isNaN(Number(v)) ? Number(v) : v);\nfunction toObjs(rows) {\n  if (!rows || !rows.length) return [];\n  const header = rows[0].map(h => (h || '').trim());\n  const out = [];\n  for (let i = 1; i < rows.length; i++) {\n    const r = rows[i]; if (!r || !r.some(c => c && String(c).trim())) continue;\n    const o = {}; header.forEach((h, j) => { if (h) o[h] = coerce((r[j] ?? '').toString().trim()); });\n    out.push(o);\n  }\n  return out;\n}\nconst pfx = (arr, key, p) => arr.filter(r => String(r[key] || '').startsWith(p));\n\nexport function shape(rowsByTab) {\n  const config = {};\n  toObjs(rowsByTab.Config).forEach(r => { if (r.Key) config[r.Key] = r.Value; });\n  return {\n    config,\n    primaryStats: pfx(toObjs(rowsByTab.PrimaryStat), 'PrimaryStatID', 'stat_'),\n    secondaryStats: pfx(toObjs(rowsByTab.SecondaryStat), 'SecondaryStatID', 'sec_'),\n    statusEffects: pfx(toObjs(rowsByTab.StatusEffect), 'StatusID', 'status_'),\n    weaponAttributes: toObjs(rowsByTab.WeaponAttribute).filter(r => r.AttributeName_EN && r.StatusEffect_KR),\n    weapons: pfx(toObjs(rowsByTab.Weapon), 'WeaponID', 'weapon_'),\n    armor: pfx(toObjs(rowsByTab.Armor), 'ArmorID', 'armor_'),\n    items: pfx(toObjs(rowsByTab.Item), 'ItemID', 'item_'),\n    monsters: pfx(toObjs(rowsByTab.Monster), 'MonsterID', 'monster_'),\n    cities: pfx(toObjs(rowsByTab.City), 'CityID', 'city_'),\n    zones: pfx(toObjs(rowsByTab.Zone), 'ZoneID', 'city_'),\n    vendors: pfx(toObjs(rowsByTab.Vendor), 'VendorID', 'vendor_'),\n    shops: pfx(toObjs(rowsByTab.Shop), 'ShopID', 'shop_'),\n    lootTable: toObjs(rowsByTab.LootTable).filter(r => String(r.MonsterID || '').startsWith('monster_') && r.ItemID),\n    artifacts: toObjs(rowsByTab.Artifact || []),\n    affixes: toObjs(rowsByTab.Affix || []).filter(r => String(r.AffixID || '').trim()),\n  };\n}\n\nexport function buildIndex(DATA) {\n  const byId = {\n    item: Object.fromEntries(DATA.items.map(x => [x.ItemID, x])),\n    weapon: Object.fromEntries(DATA.weapons.map(x => [x.WeaponID, x])),\n    armor: Object.fromEntries(DATA.armor.map(x => [x.ArmorID, x])),\n    monster: Object.fromEntries(DATA.monsters.map(x => [x.MonsterID, x])),\n    zone: Object.fromEntries(DATA.zones.map(x => [x.ZoneID, x])),\n    city: Object.fromEntries(DATA.cities.map(x => [x.CityID, x])),\n    vendor: Object.fromEntries(DATA.vendors.map(x => [x.VendorID, x])),\n    status: Object.fromEntries(DATA.statusEffects.map(x => [x.Attribute, x])),\n  };\n  return { byId };\n}\n",
  en: "// RL Prototype — pure game engine. No DOM.\n// Data source is swappable: starts from the bundled snapshot, can be replaced\n// live via setDATA() (e.g. a fresh Google-Sheets fetch).\nimport { DATA as FALLBACK } from './data/game-data.js';\nimport { buildIndex } from './sheet-loader.js';\n\nexport let DATA = FALLBACK;\nexport let byId = buildIndex(FALLBACK).byId;\nlet C = DATA.config;\nexport function anyItem(id){ return byId.item[id] || byId.weapon[id] || byId.armor[id] || null; }\nexport function anyName(id){ const o = anyItem(id); return o ? (o.ItemName_KR || o.WeaponName_KR || o.ArmorName_KR || id) : id; }\n// swap the live data set (returns count summary)\nexport function setDATA(newData){\n  DATA = newData; C = DATA.config; byId = buildIndex(newData).byId;\n  return { monsters: DATA.monsters.length, items: DATA.items.length, zones: DATA.zones.length };\n}\nconst N = (v, d = 0) => (v === '' || v == null || isNaN(Number(v)) ? d : Number(v));\nconst rand = (a, b) => a + Math.random() * (b - a);\nconst randInt = (a, b) => Math.floor(rand(a, b + 1));\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\nexport const R = { rand, randInt, clamp };\n\nconst PRIM = { stat_str: 'str', stat_dex: 'dex', stat_vit: 'vit', stat_will: 'will' };\n\n// ---------- starting state ----------\nexport function startingState() {\n  const sp = String(C.start_primary_stats || '10,10,10,10').split(',').map(x => N(x, 10));\n  const primary = { str: sp[0], dex: sp[1], vit: sp[2], will: sp[3] };\n  const growth = {\n    str: { level: sp[0], points: 0 }, dex: { level: sp[1], points: 0 },\n    vit: { level: sp[2], points: 0 }, will: { level: sp[3], points: 0 },\n  };\n  const vaultIds = String(C.start_vault_items || 'weapon_wooden_sword,armor_cloth_hood').split(',').map(s => s.trim()).filter(Boolean);\n  const vault = vaultIds.map(id => mkInstance(id));\n  // auto-equip the starting weapon + head/body if present in vault\n  const equip = { weapon: null, head: null, body: null };\n  for (const it of vault) {\n    if (it.kind === 'weapon' && !equip.weapon) equip.weapon = it.uid;\n    else if (it.kind === 'armor') {\n      const a = byId.armor[it.id];\n      if (a && a.Category === 'Head' && !equip.head) equip.head = it.uid;\n      if (a && a.Category === 'Body' && !equip.body) equip.body = it.uid;\n    }\n  }\n  return {\n    sato: N(C.start_sato, 0),\n    hp: null, sta: null,          // filled after derive\n    primary, growth,\n    vault, bag: [],               // item instances\n    equip,\n    sorties: 0,\n    shopStock: {},                // shopId+itemId -> remaining\n  };\n}\n\nlet _uid = 1;\nexport function mkInstance(id, qty = 1) {\n  const w = byId.weapon[id], a = byId.armor[id], it = byId.item[id];\n  let kind = 'item', maxDur = 0;\n  if (w) { kind = 'weapon'; maxDur = N(w.MaxDurability); }\n  else if (a) { kind = 'armor'; maxDur = N(a.MaxDurability); }\n  const inst = { uid: 'u' + (_uid++), id, kind, qty };\n  if (kind === 'weapon' || kind === 'armor') { inst.dur = maxDur; inst.maxDur = maxDur; }\n  // roll ranged stats once, fixed for the life of this instance\n  if (w) {\n    inst.minAtk = randInt(N(w.MinAtk_Low), N(w.MinAtk_High));\n    inst.maxAtk = randInt(N(w.MaxAtk_Low), N(w.MaxAtk_High));\n    if (inst.maxAtk < inst.minAtk) inst.maxAtk = inst.minAtk;\n  } else if (a) {\n    inst.def = randInt(N(a.Def_Low), N(a.Def_High));\n  }\n  // roll prefix + suffix affixes from the item's group pools\n  if (w) inst.affixes = [rollAffix('weapon', w.PrefixGroups, 'prefix'), rollAffix('weapon', w.SuffixGroups, 'suffix')].filter(Boolean);\n  else if (a) inst.affixes = [rollAffix('armor', a.PrefixGroups, 'prefix'), rollAffix('armor', a.SuffixGroups, 'suffix')].filter(Boolean);\n  return inst;\n}\n\n// weighted-random one affix from the pools referenced by the item, of the given type\nfunction rollAffix(category, groupsStr, type) {\n  const groups = String(groupsStr || '').split(',').map(s => s.trim()).filter(Boolean);\n  if (!groups.length) return null;\n  const pool = DATA.affixes.filter(af => af.AffixType === type && (!af.Category || af.Category === category) && groups.includes(af.GroupID));\n  if (!pool.length) return null;\n  const total = pool.reduce((s, af) => s + Math.max(1, N(af.Weight, 1)), 0);\n  let r = Math.random() * total, pick = pool[pool.length - 1];\n  for (const af of pool) { r -= Math.max(1, N(af.Weight, 1)); if (r <= 0) { pick = af; break; } }\n  return { affixId: pick.AffixID, name: pick.AffixName_KR, type, target: pick.TargetStat, targetKr: pick.TargetStat_KR, value: randInt(N(pick.Value_Min), N(pick.Value_Max)) };\n}\n\n// ---------- stat derivation ----------\nexport function deriveSecondary(primary) {\n  const sec = {};\n  for (const r of DATA.secondaryStats) {\n    const id = r.SecondaryStatID, src = PRIM[r.SourcePrimary];\n    const add = N(r.BaseValue) + (primary[src] || 0) * N(r.ValuePerPoint);\n    sec[id] = (sec[id] || 0) + add;\n  }\n  return sec;\n}\n\n// build the full combat profile for the player given state\nexport function playerProfile(state, staminaZero = false) {\n  const w = state.equip.weapon ? instById(state, state.equip.weapon) : null;\n  const wd = w ? byId.weapon[w.id] : null;\n  const headInst = state.equip.head ? instById(state, state.equip.head) : null;\n  const bodyInst = state.equip.body ? instById(state, state.equip.body) : null;\n  const head = headInst ? byId.armor[headInst.id] : null;\n  const body = bodyInst ? byId.armor[bodyInst.id] : null;\n  // gather affix bonuses from equipped gear (prefix/suffix rolled per instance)\n  const primAdd = { str: 0, dex: 0, vit: 0, will: 0 }; const secAdd = {};\n  for (const inst of [w, headInst, bodyInst]) {\n    if (!inst || !inst.affixes) continue;\n    for (const af of inst.affixes) { const pk = PRIM[af.target]; if (pk) primAdd[pk] += af.value; else secAdd[af.target] = (secAdd[af.target] || 0) + af.value; }\n  }\n  const p = { ...state.primary };\n  if (staminaZero) { const k = 1 - N(C.stamina_penalty_rate, 0.5); p.str *= k; p.dex *= k; p.vit *= k; p.will *= k; }\n  p.str += primAdd.str; p.dex += primAdd.dex; p.vit += primAdd.vit; p.will += primAdd.will;\n  const sec = deriveSecondary(p);\n  const armorDef = (headInst ? (headInst.def ?? N(head.Def_Low)) : 0) + (bodyInst ? (bodyInst.def ?? N(body.Def_Low)) : 0);\n  const armorEva = (head ? N(head.Evasion) : 0) + (body ? N(body.Evasion) : 0);\n  const armorSR = (head ? N(head.StatusResist) : 0) + (body ? N(body.StatusResist) : 0);\n  const speedMult = clamp(1 + p.dex * 0.015, 0.3, 3);\n  const sa = k => secAdd[k] || 0;\n  return {\n    name: '나',\n    maxHp: Math.round(sec.sec_max_hp + sa('sec_max_hp')),\n    minAtk: sec.sec_min_atk + (w ? (w.minAtk ?? N(wd.MinAtk_Low)) : 0) + sa('sec_min_atk'),\n    maxAtk: sec.sec_max_atk + (w ? (w.maxAtk ?? N(wd.MaxAtk_High)) : 1) + sa('sec_max_atk'),\n    defense: sec.sec_defense + armorDef + sa('sec_defense'),\n    atkSpeed: clamp((wd ? N(wd.AttackSpeed, 1) : 1) * speedMult, 0.2, 3),\n    accuracy: sec.sec_accuracy + (wd ? N(wd.Accuracy) : 0) + sa('sec_accuracy'),\n    evasion: sec.sec_evasion + armorEva + sa('sec_evasion'),\n    critChance: sec.sec_crit_chance + (wd ? N(wd.CritChance) : 0) + sa('sec_crit_chance'),\n    critResist: sec.sec_crit_resist + sa('sec_crit_resist'),\n    statusResist: sec.sec_status_resist + armorSR + sa('sec_status_resist'),\n    potency: wd ? N(wd.Potency) : 0,\n    attribute: wd ? wd.Attribute : null,\n    weaponMaxDmg: w ? (w.maxAtk ?? N(wd.MaxAtk_High)) : 2,\n    primAdd,\n    sec,\n  };\n}\n\nexport function monsterProfile(m) {\n  return {\n    name: m.MonsterName_KR, id: m.MonsterID,\n    maxHp: N(m.BaseHP), minAtk: N(m.MinATK), maxAtk: N(m.MaxATK),\n    defense: N(m.Defense), atkSpeed: N(m.AttackSpeed, 1),\n    accuracy: N(m.Accuracy), evasion: N(m.Evasion),\n    critChance: N(m.CritChance), critResist: N(m.CritResist),\n    statusResist: N(m.StatusResist), potency: N(m.Potency),\n    attribute: m.StatusAttack || null, weaponMaxDmg: N(m.MaxATK),\n    grade: m.Grade, staminaCost: N(m.StaminaCost, 1), timeLimit: N(m.CombatTimeLimit, 20),\n  };\n}\n\nexport function instById(state, uid) {\n  return state.vault.find(x => x.uid === uid) || state.bag.find(x => x.uid === uid) || null;\n}\n\n// ---------- combat resolution helpers ----------\nfunction hitChance(acc, eva) { const s = acc + eva; return s <= 0 ? 0.85 : clamp(acc / s, 0.1, 0.95); }\nfunction critChance(cc, cr) {\n  const s = cc + cr, ratio = s <= 0 ? 0.5 : cc / s;\n  return clamp(N(C.crit_proc_min, 0.05) + (N(C.crit_proc_max, 0.5) - N(C.crit_proc_min, 0.05)) * ratio, N(C.crit_proc_min), N(C.crit_proc_max));\n}\nfunction statusChance(pot, res) {\n  const s = pot + res, ratio = s <= 0 ? 0 : pot / s;\n  return clamp(N(C.status_proc_min, 0.05) + (N(C.status_proc_max, 0.25) - N(C.status_proc_min, 0.05)) * ratio, N(C.status_proc_min), N(C.status_proc_max));\n}\nfunction defMitigate(dmg, def, pierceFrac = 0) {\n  const K = N(C.defense_constant, 60);\n  const eff = def * (1 - pierceFrac);\n  return dmg * (K / (K + Math.max(0, eff)));\n}\nconst ATTR_KR = { bleed: '출혈', stun: '기절', pierce: '관통', rupture: '파열', sever: '절단' };\n\n// ---------- one combat encounter ----------\n// returns { log:[{t,who,type,text}], winner:'player'|'monster'|'timeout', triggers, playerHpEnd }\nexport function simulateCombat(pProf, mProf, playerHpStart) {\n  const log = [];\n  const A = { ...pProf, hp: playerHpStart != null ? playerHpStart : pProf.maxHp, side: 'player', next: 0, stunUntil: 0, bleed: [], ruptureStacks: 0, ruptureUntil: 0 };\n  const B = { ...mProf, hp: mProf.maxHp, side: 'monster', next: 0, stunUntil: 0, bleed: [], ruptureStacks: 0, ruptureUntil: 0 };\n  const triggers = { hitsLanded: 0, evades: 0, hitsTaken: 0, critsLanded: 0 };\n  const limit = mProf.timeLimit;\n  let t = 0, guard = 0;\n  const push = (who, type, text) => log.push({ t: +t.toFixed(1), who, type, text, hpP: Math.max(0, Math.round(A.hp)), hpM: Math.max(0, Math.round(B.hp)) });\n  push('sys', 'start', `${mProf.name} (${mProf.grade}) 과(와) 조우. 제한시간 ${limit}s.`);\n\n  function applyBleedTicks(actor, now) {\n    actor.bleed = actor.bleed.filter(b => b.until > now);\n    // handled via scheduled ticks below (simplified: apply on each actor's turn)\n  }\n  function ruptureMult(actor, now) {\n    if (actor.ruptureUntil > now && actor.ruptureStacks > 0) {\n      const per = 0.10 + 0.05 * (actor.ruptureStacks - 1);\n      return clamp(1 - per, 0.3, 1);\n    }\n    return 1;\n  }\n\n  while (A.hp > 0 && B.hp > 0 && t <= limit && guard++ < 400) {\n    // whoever acts next\n    const actor = A.next <= B.next ? A : B;\n    const foe = actor === A ? B : A;\n    t = actor.next;\n    if (t > limit) break;\n\n    // bleed dot resolves as time passes on this actor\n    for (const b of actor.bleed) {\n      while (b.nextTick <= t && b.until >= b.nextTick) {\n        actor.hp -= b.dmg;\n        push(actor.side, 'dot', `${actor.side === 'player' ? '나' : actor.name} 출혈 피해 −${b.dmg.toFixed(0)} (HP ${Math.max(0, actor.hp).toFixed(0)})`);\n        b.nextTick += b.interval;\n        if (actor.hp <= 0) break;\n      }\n    }\n    actor.bleed = actor.bleed.filter(b => b.until > t);\n    if (actor.hp <= 0) break;\n\n    if (actor.stunUntil > t) { // stunned: skip, reschedule\n      push(actor.side, 'stun', `${actor.side === 'player' ? '나' : actor.name} 기절 — 행동 지연`);\n      actor.next = actor.stunUntil + 1 / actor.atkSpeed;\n      continue;\n    }\n\n    // attempt hit\n    const hc = hitChance(actor.accuracy, foe.evasion);\n    const nm = actor.side === 'player' ? '나' : actor.name;\n    const fnm = foe.side === 'player' ? '나' : foe.name;\n    if (Math.random() > hc) {\n      push(actor.side, 'miss', `${nm} 공격 → ${fnm} 회피 (명중률 ${(hc * 100).toFixed(0)}%)`);\n      if (foe.side === 'player') triggers.evades++;\n      actor.next = t + 1 / actor.atkSpeed;\n      continue;\n    }\n    // damage\n    let dmg = rand(actor.minAtk, actor.maxAtk) * ruptureMult(actor, t);\n    const isCrit = Math.random() < critChance(actor.critChance, foe.critResist);\n    if (isCrit) { dmg *= N(C.crit_damage_mult, 1.5); if (actor.side === 'player') triggers.critsLanded++; }\n    // pierce (attacker attribute)\n    let pierceFrac = 0;\n    if (actor.attribute === 'pierce' && Math.random() < statusChance(actor.potency, foe.statusResist)) {\n      pierceFrac = rand(N(byId.status.pierce?.Value, 0.05), N(byId.status.pierce?.ValueMax, 0.4));\n    }\n    const final = defMitigate(dmg, foe.defense, pierceFrac);\n    foe.hp -= final;\n    if (actor.side === 'player') triggers.hitsLanded++;\n    if (foe.side === 'player') triggers.hitsTaken++;\n    let tail = `공격 → ${fnm} −${final.toFixed(0)}`;\n    if (isCrit) tail = `⟪치명타⟫ ` + tail;\n    if (pierceFrac > 0) tail += ` (관통 −방어${(pierceFrac * 100).toFixed(0)}%)`;\n    push(actor.side, isCrit ? 'crit' : 'hit', `${nm} ${tail} · HP ${Math.max(0, foe.hp).toFixed(0)}/${foe.maxHp}`);\n\n    // status application (non-pierce)\n    if (actor.attribute && actor.attribute !== 'pierce' && foe.hp > 0) {\n      const sc = statusChance(actor.potency, foe.statusResist);\n      if (Math.random() < sc) {\n        const eff = actor.attribute;\n        if (eff === 'bleed') {\n          const s = byId.status.bleed;\n          const dmgPer = actor.weaponMaxDmg * N(s?.Value, 0.5);\n          const dur = N(s?.Duration, 4), iv = N(s?.TickInterval, 2);\n          foe.bleed.push({ dmg: dmgPer, until: t + dur, nextTick: t + iv, interval: iv });\n          if (foe.bleed.length > N(s?.MaxStack, 3)) foe.bleed.shift();\n          push(actor.side, 'status', `▶ ${fnm} 출혈 (${dmgPer.toFixed(0)}/tick, ${dur}s)`);\n        } else if (eff === 'stun') {\n          const s = byId.status.stun;\n          const delay = (1 / actor.atkSpeed) * N(s?.Value, 0.5);\n          foe.stunUntil = Math.max(foe.stunUntil, foe.next) + delay;\n          push(actor.side, 'status', `▶ ${fnm} 기절 (+${delay.toFixed(1)}s 지연)`);\n        } else if (eff === 'rupture') {\n          const s = byId.status.rupture;\n          foe.ruptureStacks = Math.min(N(s?.MaxStack, 3), foe.ruptureStacks + 1);\n          foe.ruptureUntil = t + N(s?.Duration, 3);\n          push(actor.side, 'status', `▶ ${fnm} 파열 x${foe.ruptureStacks} (공격력↓)`);\n        }\n      }\n    }\n    actor.next = t + 1 / actor.atkSpeed;\n  }\n\n  let winner = 'timeout';\n  if (B.hp <= 0) winner = 'player';\n  else if (A.hp <= 0) winner = 'monster';\n  if (winner === 'player') push('sys', 'win', `${mProf.name} 처치. (${t.toFixed(1)}s)`);\n  else if (winner === 'monster') push('sys', 'lose', `쓰러졌다… (${t.toFixed(1)}s)`);\n  else push('sys', 'timeout', `제한시간 초과 — ${mProf.name} 을(를) 쓰러뜨리지 못했다.`);\n  return { log, winner, triggers, playerHpEnd: Math.max(0, A.hp), elapsed: +t.toFixed(1) };\n}\n\n// ---------- loot ----------\nexport function rollLoot(monsterId) {\n  const out = [];\n  for (const r of DATA.lootTable) {\n    if (r.MonsterID !== monsterId || !r.ItemID) continue;\n    if (Math.random() * 100 < N(r.DropRate)) {\n      out.push({ id: r.ItemID, qty: randInt(N(r.MinQty, 1), N(r.MaxQty, 1)) });\n    }\n  }\n  return out;\n}\n\n// ---------- growth ----------\nexport function growthMultiplier(state, stat) {\n  const tagKey = { str: 'GrowthTag_Str', dex: 'GrowthTag_Dex', vit: 'GrowthTag_Vit', will: 'GrowthTag_Will' }[stat];\n  let tags = 0;\n  for (const uid of [state.equip.weapon, state.equip.head, state.equip.body]) {\n    if (!uid) continue; const inst = instById(state, uid); if (!inst) continue;\n    const src = byId.weapon[inst.id] || byId.armor[inst.id];\n    if (src) tags += N(src[tagKey]);\n  }\n  return N(C.growth_tag_mult_base, 0.25) + N(C.growth_tag_mult_step, 0.25) * tags;\n}\nexport function growthReq(level) { return N(C.growth_A, 5) * Math.pow(N(C.growth_r, 1.35), level - 1); }\nconst POINT_PER = { str: 1, dex: 2, vit: 1.5, will: 4 };\nexport function applyGrowth(state, triggers) {\n  const map = { str: triggers.hitsLanded, dex: triggers.evades, vit: triggers.hitsTaken, will: triggers.critsLanded };\n  const ups = [];\n  for (const stat of ['str', 'dex', 'vit', 'will']) {\n    const n = map[stat]; if (!n) continue;\n    const g = state.growth[stat];\n    g.points += n * POINT_PER[stat] * growthMultiplier(state, stat);\n    let leveled = 0;\n    while (g.points >= growthReq(g.level)) { g.points -= growthReq(g.level); g.level++; leveled++; }\n    if (leveled) { state.primary[stat] = g.level; ups.push({ stat, to: g.level, by: leveled }); }\n  }\n  return ups;\n}\nexport function growthPct(state, stat) {\n  const g = state.growth[stat];\n  return clamp((g.points / growthReq(g.level)) * 100, 0, 100);\n}\n\nexport { ATTR_KR, N };\n"
};

  void:'oklch(0.150 0.006 264)', bg:'oklch(0.185 0.006 264)', s1:'oklch(0.215 0.007 264)',
  s2:'oklch(0.255 0.008 264)', s3:'oklch(0.300 0.009 264)', line:'oklch(0.340 0.008 264)',
  line2:'oklch(0.420 0.010 264)', hi:'oklch(0.940 0.004 264)', mid:'oklch(0.740 0.006 264)',
  lo:'oklch(0.550 0.008 264)', faint:'oklch(0.420 0.008 264)', danger:'oklch(0.620 0.120 28)',
  warn:'oklch(0.740 0.085 72)', good:'oklch(0.720 0.078 148)', sato:'oklch(0.740 0.055 224)',
  hp:'oklch(0.580 0.100 25)', sta:'oklch(0.720 0.075 74)', growth:'oklch(0.660 0.045 264)',
  dur:'oklch(0.740 0.012 250)', bleed:'oklch(0.640 0.120 28)', stun:'oklch(0.800 0.090 88)',
  pierce:'oklch(0.700 0.055 232)', rupture:'oklch(0.660 0.090 330)',
  mono:"'IBM Plex Mono',monospace", sans:"'IBM Plex Sans KR',sans-serif"
};
const ATTR = { bleed:{kr:'출혈',c:T.bleed}, stun:{kr:'기절',c:T.stun}, pierce:{kr:'관통',c:T.pierce}, rupture:{kr:'파열',c:T.rupture}, sever:{kr:'절단',c:T.mid} };
const AT = (x)=> (x && ATTR[x]) ? ATTR[x] : null;
const CATKR = { Weapon:'무기', Head:'투구', Body:'갑옷', Medicine:'약품', Food:'음식', Junk:'정크', Quest:'퀘스트', Key:'키' };
// tiny inline icons
const ICON = {
  home:'M3 11.5 12 4l9 7.5M5 10v10h14V10',
  pkg:'M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10',
  cross:'M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 100 8 4 4 0 000-8z',
  user:'M12 12a4 4 0 100-8 4 4 0 000 8zM5 20c0-3.5 3-6 7-6s7 2.5 7 6',
  gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM19 12l1.5 1-1.5 2.6-1.8-.5-1.5.9-.4 1.9h-3l-.4-1.9-1.5-.9-1.8.5L5 15l1.5-1L6 12l-1.5-1L6 8.4l1.8.5 1.5-.9L9.7 6h3l.4 1.9 1.5.9 1.8-.5L18 8.4 16.5 10z'
};
const svg = (d,sz=20,c='currentColor',sw=1.6)=>h('svg',{width:sz,height:sz,viewBox:'0 0 24 24',fill:'none',stroke:c,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d}));

class Component extends React.Component {
  state = { ready:false, screen:'safehouse', modalZone:null, sel:null, seg:'vault', filter:'전체', toast:null };
  async componentDidMount(){
    try{
      const eng = window.__RL_ENGINE;
      const loader = window.__RL_LOADER;
      this.eng = eng; this.loader = loader; this.dataSrc = 'bundled';
      await this.loadData();
      this.newRun(true);
      this.setState({ ready:true });
    }catch(e){ console.error('engine load failed', e); this.setState({ ready:true, err:String(e) }); }
  }
  async loadData(){
    try{
      const rows = await this.loader.fetchAllTabs();
      this.eng.setDATA(this.loader.shape(rows));
      try{ localStorage.setItem('rl_sheet_cache', JSON.stringify(rows)); }catch(_){}
      this.dataSrc = 'live'; return 'live';
    }catch(e){
      console.warn('live sheet fetch failed, falling back', e);
      try{ const c = localStorage.getItem('rl_sheet_cache'); if(c){ this.eng.setDATA(this.loader.shape(JSON.parse(c))); this.dataSrc='cache'; return 'cache'; } }catch(_){}
      this.dataSrc = 'bundled'; return 'bundled';
    }
  }
  clearCache(){ let n=0; try{ if(localStorage.getItem('rl_sheet_cache')!=null){ localStorage.removeItem('rl_sheet_cache'); n++; } }catch(_){}
    this.flash(n?'캐시 삭제 완료':'삭제할 캐시 없음'); this.forceUpdate(); }
  async reloadSheet(){
    this.flash('시트 불러오는 중…');
    const src = await this.loadData();
    this.newRun(true); this.combat=null; this.go('safehouse');
    this.flash(src==='live'?'시트 반영 완료 — 새 캐릭터':src==='cache'?'연결 실패 · 캐시 사용':'번들 데이터 사용');
  }
  componentWillUnmount(){ if(this._t) clearInterval(this._t); }
  componentDidUpdate(){ if(this.logRef){ this.logRef.scrollTop = this.logRef.scrollHeight; } }

  newRun(fresh){
    const gs = this.eng.startingState();
    const full = this.eng.playerProfile(gs,false);
    this.staMax = 10;
    gs.maxHp = full.maxHp; gs.hp = full.maxHp; gs.sta = this.staMax;
    this.gs = gs; this.combat = null;
    // equipped gear is 'carried' — it lives in 소지품(bag), never in 금고(vault)
    ['weapon','head','body'].forEach(s=>{ if(gs.equip[s]) this.moveToBag(gs.equip[s]); });
  }
  moveToBag(uid){ const i=this.gs.vault.findIndex(x=>x.uid===uid); if(i>=0){ const [it]=this.gs.vault.splice(i,1); this.gs.bag.push(it); } }
  rest(){ const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=full.maxHp; this.gs.sta=this.staMax; }
  go(screen){ if(this._t){clearInterval(this._t); this._t=null;} this.setState({ screen, modalZone:null, sel:null }); }
  flash(msg){ this.setState({toast:msg}); clearTimeout(this._ft); this._ft=setTimeout(()=>this.setState({toast:null}),1600); }

  // ---------- sortie / combat ----------
  zonePool(zoneId){
    const direct=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').map(s=>s.trim()).includes(zoneId));
    if(direct.length) return direct;
    // no explicit pool (e.g. hidden zone) -> auto-populate from the same city's monsters
    const z=this.eng.byId.zone[zoneId];
    if(z){ const pool=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').some(s=>{ const zz=this.eng.byId.zone[s.trim()]; return zz&&zz.CityID===z.CityID; })); if(pool.length) return pool; }
    return this.eng.DATA.monsters;
  }
  hasItem(id){ return this.gs.vault.some(x=>x.id===id)||this.gs.bag.some(x=>x.id===id); }
  consumeItem(id){ const dec=(arr)=>{ const i=arr.findIndex(x=>x.id===id); if(i<0) return false; if(arr[i].qty>1) arr[i].qty--; else arr.splice(i,1); return true; }; return dec(this.gs.bag)||dec(this.gs.vault); }
  startSortie(zoneId){
    const z=this.eng.byId.zone[zoneId];
    if(z && this.eng.N(z.IsHidden)===1 && z.UnlockType==='item' && z.UnlockKey){ this.consumeItem(z.UnlockKey); this.flash('키카드 사용 — 봉쇄 해제'); }
    this.rest();
    this.combat = { zoneId, encounter:0, runLoot:[] };
    this.setState({ screen:'combat', modalZone:null });
    this.previewEncounter();
  }
  previewEncounter(){
    const pool = this.zonePool(this.combat.zoneId);
    const m = pool[Math.floor(Math.random()*pool.length)];
    const mProf = this.eng.monsterProfile(m);
    Object.assign(this.combat, { mProf, phase:'preview', res:null, revealed:0, loot:[], ups:[] });
    if(this._t){ clearInterval(this._t); this._t=null; }
    this.forceUpdate();
  }
  enterCombat(){
    const mProf = this.combat.mProf;
    this.gs.sta = Math.max(0, this.gs.sta - mProf.staminaCost);
    const staZero = this.gs.sta <= 0;
    const full = this.eng.playerProfile(this.gs,false);
    const prof = this.eng.playerProfile(this.gs, staZero); prof.maxHp = full.maxHp;
    const res = this.eng.simulateCombat(prof, mProf, this.gs.hp);
    Object.assign(this.combat, { prof:full, res, revealed:1, phase:'fighting', staZero, encounter:this.combat.encounter+1 });
    this.forceUpdate();
    if(this._t) clearInterval(this._t);
    this._t = setInterval(()=>this.tick(), 300);
  }
  tick(){
    const c=this.combat;
    if(c.revealed < c.res.log.length){ c.revealed++; this.forceUpdate(); }
    else { clearInterval(this._t); this._t=null; this.finishCombat(); }
  }
  finishCombat(){
    const c=this.combat, res=c.res;
    this.gs.hp = res.playerHpEnd;
    if(res.winner==='player'){
      const loot = this.eng.rollLoot(c.mProf.id);
      // prototype drop: the police keycard can drop in 하람(city_01) if not already held
      const z=this.eng.byId.zone[c.zoneId];
      if(z && z.CityID==='city_01' && !this.hasItem('item_police_keycard') && Math.random()<0.25){ loot.push({id:'item_police_keycard', qty:1}); }
      for(const l of loot){ this.addToBag(l.id, l.qty); c.runLoot.push(l); }
      c.loot = loot;
      c.ups = this.eng.applyGrowth(this.gs, res.triggers);
      const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
      c.phase='won';
    } else if(res.winner==='monster'){ c.phase='dead'; }
    else { c.phase='timeout'; }
    this.forceUpdate();
  }
  addToBag(id, qty){
    const src = this.eng.byId.item[id];
    if(src && this.eng.N(src.MaxStack,1)>1){
      const ex = this.gs.bag.find(x=>x.id===id);
      if(ex){ ex.qty+=qty; return; }
    }
    for(let i=0;i<qty;i++){ const inst=this.eng.mkInstance(id,1); this.gs.bag.push(inst); if(this.eng.N((src||{}).MaxStack,1)>1){ inst.qty=qty; break; } }
  }
  extract(){ this.setState({ screen:'result' }); this.combat.result='extract'; if(this._t){clearInterval(this._t);this._t=null;} this.forceUpdate(); }
  death(){
    // 소지품(bag)은 전부 잃되, 착용 중인 장비는 유지된다
    this.gs.bag = this.gs.bag.filter(x=>this.isEquipped(x.uid));
    const eq = [this.gs.equip.weapon,this.gs.equip.head,this.gs.equip.body].filter(Boolean);
    let broke=null;
    if(eq.length){ const uid=eq[Math.floor(Math.random()*eq.length)]; const inst=this.eng.instById(this.gs,uid);
      if(inst){ inst.maxDur=Math.max(0,(inst.maxDur||0)-this.eng.R.randInt(2,5)); inst.dur=Math.min(inst.dur||0,inst.maxDur); broke=inst; } }
    this.combat.result='death'; this.combat.broke=broke;
    this.setState({ screen:'result' });
  }
  toSafehouse(){ this.rest(); this.gs.sorties++; this.combat=null; this.go('safehouse'); }

  // ---------- inventory ----------
  moveItem(uid){
    const inV = this.gs.vault.findIndex(x=>x.uid===uid);
    if(inV>=0){ const [it]=this.gs.vault.splice(inV,1); this.gs.bag.push(it); }
    else { const inB=this.gs.bag.findIndex(x=>x.uid===uid); if(inB>=0){
      // 착용 중인 장비는 금고로 보낼 수 없다 — 옮기면 자동 해제
      if(this.isEquipped(uid)){ const e=this.gs.equip; ['weapon','head','body'].forEach(s=>{ if(e[s]===uid) e[s]=null; }); const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=Math.min(this.gs.hp,this.gs.maxHp); }
      const [it]=this.gs.bag.splice(inB,1); this.gs.vault.push(it);
    } }
    this.forceUpdate();
  }
  // ---------- shop ----------
  buy(shopId, row){
    const price=this.eng.N(row.BuyPrice);
    const key=shopId+'|'+row.ItemID;
    const stock = this.gs.shopStock[key]!=null ? this.gs.shopStock[key] : this.eng.N(row.StockMax,99);
    if(this.gs.sato < price){ this.flash('사토가 부족하다'); return; }
    if(stock<=0){ this.flash('재고 없음'); return; }
    this.gs.sato -= price; this.gs.shopStock[key]=stock-1; this.addToVault(row.ItemID,1);
    this.flash(row.ItemName_KR+' 구매'); this.forceUpdate();
  }
  addToVault(id,qty){ const src=this.eng.byId.item[id];
    if(src && this.eng.N(src.MaxStack,1)>1){ const ex=this.gs.vault.find(x=>x.id===id); if(ex){ex.qty+=qty;return;} }
    const inst=this.eng.mkInstance(id,qty); this.gs.vault.push(inst); }

  // ================= RENDER =================
  renderVals(){ let screenEl; try{ screenEl = this.state.ready ? this.renderApp() : this.loading(); }catch(e){ console.error('renderApp threw:', e); screenEl = this.loading(); } return { screenEl }; }
  loading(){ return this.phone(h('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:T.lo,fontFamily:T.mono,fontSize:13}}, this.state && this.state.err ? ('오류: '+this.state.err) : '불러오는 중…')); }
  phone(...kids){ return h('div',{style:{width:402,height:874,background:T.bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative',boxShadow:'0 24px 80px rgba(0,0,0,.6)',border:'1px solid '+T.line}}, ...kids); }

  bar(label, val, max, color){
    const pct = max>0 ? Math.max(0,Math.min(100,(val/max)*100)) : 0;
    return h('div',{style:{flex:1}},
      h('div',{style:{display:'flex',justifyContent:'space-between',fontFamily:T.mono,fontSize:10,letterSpacing:'.05em',color:T.lo,marginBottom:4}}, h('span',null,label), h('span',{style:{color:T.mid}}, Math.round(val)+' / '+Math.round(max))),
      h('div',{style:{height:6,background:T.s3,borderRadius:1,overflow:'hidden'}}, h('div',{style:{width:pct+'%',height:'100%',background:color}}))
    );
  }
  chip(txt,color){ return h('span',{style:{fontFamily:T.mono,fontSize:10,fontWeight:500,letterSpacing:'.04em',color:color||T.mid,border:'1px solid '+T.line2,borderRadius:2,padding:'2px 6px',whiteSpace:'nowrap'}}, txt); }
  header(){
    const g=this.gs;
    return h('div',{style:{padding:'16px 18px 12px',background:T.s1,borderBottom:'1px solid '+T.line,display:'flex',flexDirection:'column',gap:12,flex:'0 0 auto'}},
      h('div',{style:{display:'flex',gap:12}}, this.bar('생명력',g.hp,g.maxHp,T.hp), this.bar('스태미너',g.sta,this.staMax,T.sta)),
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        h('div',{style:{fontFamily:T.mono,fontSize:11,color:T.faint,letterSpacing:'.06em'}}, '출정 '+g.sorties+'회'),
        h('div',{style:{display:'flex',alignItems:'center',gap:8,background:T.s2,border:'1px solid '+T.line,borderRadius:3,padding:'5px 10px'}},
          this.chip('SATO',T.sato), h('span',{style:{fontFamily:T.mono,fontWeight:600,fontSize:15,color:T.hi}}, g.sato.toLocaleString())))
    );
  }
  nav(){
    const items=[['safehouse','안전가옥',ICON.home],['inventory','소지품',ICON.pkg],['zone','출정',ICON.cross],['character','캐릭터',ICON.user],['settings','설정',ICON.gear]];
    return h('div',{style:{flex:'0 0 auto',display:'flex',background:T.s1,borderTop:'1px solid '+T.line}},
      ...items.map(([k,label,d])=>{ const on=this.state.screen===k || (k==='zone'&&this.state.screen==='combat');
        return h('button',{key:k,onClick:()=>this.go(k),style:{flex:1,background:'none',border:'none',cursor:'pointer',padding:'10px 0 12px',display:'flex',flexDirection:'column',alignItems:'center',gap:4,color:on?T.hi:T.faint}},
          svg(d,21,'currentColor',on?1.8:1.5), h('span',{style:{fontFamily:T.sans,fontSize:10,fontWeight:on?600:400}},label)); })
    );
  }
  screenTitle(kicker,title){ return h('div',{style:{padding:'18px 18px 14px',flex:'0 0 auto'}},
    h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.14em',color:T.faint,marginBottom:6}}, kicker),
    h('div',{style:{fontFamily:T.sans,fontSize:22,fontWeight:600,color:T.hi,letterSpacing:'-.01em'}}, title)); }
  toastEl(){ if(!this.state.toast) return null; return h('div',{style:{position:'absolute',bottom:78,left:'50%',transform:'translateX(-50%)',background:T.s3,border:'1px solid '+T.line2,color:T.hi,fontFamily:T.mono,fontSize:12,padding:'8px 16px',borderRadius:3,animation:'rlFade .2s',zIndex:20}}, this.state.toast); }

  renderApp(){
    const s=this.state.screen;
    let body;
    if(s==='safehouse') body=this.safehouse();
    else if(s==='zone') body=this.zone();
    else if(s==='combat') body=this.combatScreen();
    else if(s==='result') body=this.result();
    else if(s==='inventory') body=this.inventory();
    else if(s==='character') body=this.character();
    else if(s==='shop') body=this.shop();
    else if(s==='settings') body=this.settings();
    const showNav = s!=='combat' && s!=='result' && s!=='shop';
    return this.phone(body, this.toastEl(), showNav?this.nav():null, this.state.modalZone?this.zoneModal():null, this.state.sel?this.itemSheet():null, this.state.useOpen?this.useSheet():null);
  }

  // ---- safehouse ----
  safehouse(){
    const vendors=this.eng.DATA.vendors;
    return h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      this.header(),
      this.screenTitle('SAFEHOUSE · 하람','안전가옥'),
      h('div',{style:{padding:'0 18px 20px',overflowY:'auto',flex:1}},
        h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.12em',color:T.faint,margin:'2px 0 12px'}}, '상점'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
          ...vendors.map(v=>{ const open=v.VendorID==='vendor_clinic';
            return h('button',{key:v.VendorID,disabled:!open,onClick:open?()=>this.setState({screen:'shop'}):null,
              style:{textAlign:'left',background:open?T.s1:T.bg,border:'1px solid '+(open?T.line2:T.line),borderRadius:4,padding:'14px 15px',cursor:open?'pointer':'default',opacity:open?1:.5,display:'flex',alignItems:'center',gap:12}},
              h('div',{style:{flex:1}},
                h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
                  h('span',{style:{fontFamily:T.sans,fontSize:15,fontWeight:600,color:T.hi}}, this.shopName(v.ShopID)),
                  this.chip(v.ShopType, open?T.mid:T.faint)),
                h('div',{style:{fontFamily:T.sans,fontSize:12,color:T.lo}}, v.VendorName_KR)),
              open? svg('M9 6l6 6-6 6',18,T.mid) : h('div',{style:{display:'flex',alignItems:'center',gap:5,color:T.faint,fontFamily:T.mono,fontSize:10}}, svg('M6 10V8a4 4 0 118 0v2M5 10h10v8H5z',15,T.faint,1.6),'잠금'));
          })))
      );
  }
  shopName(id){ const map={shop_clinic:'보건소',shop_hardware:'철물점',shop_canteen:'식당',shop_blackmarket:'암시장',shop_pawnshop:'전당포'}; return map[id]||id; }

  // ---- zone select ----
  zone(){
    const zones=this.eng.DATA.zones.filter(z=>z.CityID==='city_01');
    return h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      this.screenTitle('SORTIE · 하람 (TIER 1)','출정'),
      h('div',{style:{overflowY:'auto',flex:1,paddingBottom:20}},
        ...zones.map(z=>{ const hidden=this.eng.N(z.IsHidden)===1; const unlockable = hidden && z.UnlockType==='item' && this.hasItem(z.UnlockKey); const locked = hidden && !unlockable;
          return h('button',{key:z.ZoneID,disabled:locked,onClick:locked?null:()=>this.setState({modalZone:z}),
            style:{width:'100%',textAlign:'left',background:'none',border:'none',borderBottom:'1px solid '+T.line,padding:'15px 18px',cursor:locked?'default':'pointer',opacity:locked?.45:1,display:'flex',alignItems:'center',gap:12}},
            h('div',{style:{flex:1}},
              h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
                h('span',{style:{fontFamily:T.sans,fontSize:15,fontWeight:600,color:T.hi}}, z.ZoneName_KR),
                hidden?this.chip(unlockable?'잠금 해제':'봉쇄', unlockable?T.good:T.faint):null),
              h('div',{style:{fontFamily:T.sans,fontSize:12,color:T.lo}}, '전리품: '+z.LootFocus)),
            locked? h('div',{style:{display:'flex',alignItems:'center',gap:5,color:T.faint,fontFamily:T.mono,fontSize:10}}, svg('M6 10V8a4 4 0 118 0v2M5 10h10v8H5z',15,T.faint,1.6),'키 필요')
              : (unlockable? h('div',{style:{display:'flex',alignItems:'center',gap:5,color:T.good,fontFamily:T.mono,fontSize:10}}, svg('M7 11V8a5 5 0 019.9-1M5 11h10v8H5z',15,T.good,1.6),'진입 가능') : svg('M9 6l6 6-6 6',18,T.faint)));
        }))
    );
  }
  zoneModal(){
    const z=this.state.modalZone; const pool=this.zonePool(z.ZoneID);
    return h('div',{onClick:()=>this.setState({modalZone:null}),style:{position:'absolute',inset:0,background:'oklch(0.100 0.005 264 / 0.66)',display:'flex',alignItems:'flex-end',zIndex:30,animation:'rlFade .18s'}},
      h('div',{onClick:e=>e.stopPropagation(),style:{width:'100%',background:T.s1,borderTop:'1px solid '+T.line2,borderRadius:'10px 10px 0 0',padding:'10px 18px 22px',animation:'rlSheet .24s cubic-bezier(.2,.8,.2,1)'}},
        h('div',{style:{width:34,height:4,background:T.line2,borderRadius:2,margin:'0 auto 16px'}}),
        h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.12em',color:T.faint,marginBottom:6}}, '침투 지역'),
        h('div',{style:{fontFamily:T.sans,fontSize:20,fontWeight:600,color:T.hi,marginBottom:6}}, z.ZoneName_KR),
        h('div',{style:{fontFamily:T.sans,fontSize:13,color:T.mid,lineHeight:1.5,marginBottom:14}}, z.Description||('전리품 경향: '+z.LootFocus)),
        h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.1em',color:T.faint,marginBottom:8}}, '출현 개체'),

      if(AT(w.Attribute)) out.push(['상태이상', ATTR[w.Attribute].kr+' · 부여력 '+N(w.Potency)]);
