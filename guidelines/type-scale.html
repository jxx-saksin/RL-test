<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Mobile scale — nothing below 11px" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-ui);padding:14px 20px}
  .r{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-1)}
  .r:last-child{border-bottom:0}
  .s{flex:1}
  .m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);width:190px;text-align:right}
</style>
</head>
<body>
  <div class="r"><div class="s" style="font-size:24px;font-weight:600;letter-spacing:var(--tr-tight)">출정 결과</div><div class="m">display · 24 / 600</div></div>
  <div class="r"><div class="s" style="font-size:19px;font-weight:600">장비 수리</div><div class="m">title · 19 / 600</div></div>
  <div class="r"><div class="s" style="font-size:16px;font-weight:500">녹슨 파이프</div><div class="m">heading · 16 / 500</div></div>
  <div class="r"><div class="s" style="font-size:15px;color:var(--text-mid)">내구도가 0이 되면 파괴됩니다.</div><div class="m">body · 15 / 400</div></div>
  <div class="r"><div class="s" style="font-size:14px;font-family:var(--font-mono);color:var(--text-mid)">[03] 명중 · 14 피해</div><div class="m">log · 14 mono</div></div>
  <div class="r"><div class="s" style="font-size:12px;font-family:var(--font-mono);color:var(--text-lo);letter-spacing:var(--tr-label)">CATEGORY · 무기</div><div class="m">label · 12 mono +tr</div></div>
  <div class="r"><div class="s" style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint)">00:14 · reset in 3</div><div class="m">caption · 11 mono</div></div>
</body>
</html>
