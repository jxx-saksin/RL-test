<!-- @dsCard group="Colors" viewport="700x220" name="Surfaces — elevation ladder" subtitle="Near-black cold neutral base; elevation by lightness + hairline" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-void);color:var(--text-hi);font-family:var(--font-ui);
       padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{border:1px solid var(--line-1);border-radius:var(--r-card);overflow:hidden}
  .chip{height:58px}
  .meta{padding:8px 9px;background:var(--bg-base)}
  .name{font-size:12px;color:var(--text-hi);font-weight:500}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);margin-top:2px}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--text-lo);letter-spacing:var(--tr-label)}
</style>
</head>
<body>
  <div class="cap">SURFACE LADDER · darkest → raised</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg-void)"></div><div class="meta"><div class="name">Void</div><div class="tok">--bg-void</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-base)"></div><div class="meta"><div class="name">Base</div><div class="tok">--bg-base</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><div class="name">Surface 1</div><div class="tok">--surface-1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="name">Surface 2</div><div class="tok">--surface-2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="meta"><div class="name">Surface 3</div><div class="tok">--surface-3</div></div></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="flex:1;height:1px;background:var(--line-1)"></div>
    <span class="tok">--line-1 · hairline</span>
    <div style="flex:1;height:2px;background:var(--line-2)"></div>
    <span class="tok">--line-2 · border</span>
  </div>
</body>
</html>
