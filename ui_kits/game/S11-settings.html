<!-- @dsCard group="Screens" viewport="430x800" name="S11 · 설정" subtitle="계정 로그인/로그아웃 · 언어 변경 · 피드백 (임시)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-void);font-family:var(--font-ui);color:var(--text-hi);display:flex;justify-content:center;padding:16px}
  .phone{position:relative;width:390px;background:var(--bg-base);border:1px solid var(--line-1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:760px}

  .top{flex:0 0 auto;padding:16px 18px 12px}
  .h1{font-size:22px;font-weight:600;letter-spacing:var(--tr-tight)}
  .h1 .sub{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-lo);letter-spacing:var(--tr-label);margin-top:4px;font-weight:400}

  .scroll{flex:1 1 auto;overflow-y:auto;padding:4px 16px 16px}
  .scroll::-webkit-scrollbar{display:none}

  .glabel{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:var(--tr-label);padding:16px 4px 8px}
  .group{background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-card);overflow:hidden}

  /* account block */
  .acct{display:flex;align-items:center;gap:13px;padding:15px}
  .avatar{width:42px;height:42px;border-radius:var(--r-pill);background:var(--surface-3);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--text-mid)}
  .avatar svg{width:22px;height:22px;stroke-width:1.75}
  .acct .who{flex:1;min-width:0}
  .acct .nm{font-size:15px;font-weight:500}
  .acct .id{font-family:var(--font-mono);font-size:11px;color:var(--text-lo);margin-top:2px}
  .authbtn{flex:0 0 auto;font-family:var(--font-mono);font-size:11px;padding:8px 13px;border-radius:var(--r-input);border:1px solid var(--line-2);background:transparent;cursor:pointer}
  .authbtn.out{color:var(--danger)}
  .authbtn.in{color:var(--text-hi);background:var(--surface-3)}

  .row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 15px;border-top:1px solid var(--line-1);cursor:pointer}
  .row .lbl{flex:1;font-size:14px}
  .row .val{font-family:var(--font-mono);font-size:12px;color:var(--text-lo)}
  .row .chev{color:var(--text-faint);font-size:16px;margin-left:6px}
  .row:hover{background:var(--surface-2)}

  /* language options */
  .lang{display:flex;align-items:center;min-height:50px;padding:0 15px;border-top:1px solid var(--line-1);cursor:pointer}
  .lang:first-child{border-top:0}
  .lang .lbl{flex:1;font-size:14px;color:var(--text-mid)}
  .lang.on .lbl{color:var(--text-hi)}
  .lang .check{color:var(--text-hi);opacity:0;display:flex}
  .lang.on .check{opacity:1}
  .lang .check svg{width:17px;height:17px;stroke-width:2}

  .ver{text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);padding:22px 0 6px;letter-spacing:var(--tr-label)}

  .nav{flex:0 0 auto;border-top:1px solid var(--line-1);background:var(--surface-1);display:flex;padding:8px 4px 10px}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--text-lo);position:relative}
  .ni.on{color:var(--text-hi)}
  .ni.on::before{content:"";position:absolute;top:0;width:20px;height:2px;border-radius:var(--r-pill);background:var(--text-hi)}
  .ni svg{width:20px;height:20px;stroke-width:1.75}
  .ni .lbl{font-size:10px;font-weight:500}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r-input);padding:10px 16px;font-size:13px;color:var(--text-hi);box-shadow:var(--shadow-sheet);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease);z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="h1">설정<span class="sub">SETTINGS</span></div>
    </div>

    <div class="scroll">
      <div class="glabel">계정 · ACCOUNT</div>
      <div class="group" id="acct-group"></div>

      <div class="glabel">언어 · LANGUAGE</div>
      <div class="group" id="lang-group"></div>

      <div class="glabel">지원 · SUPPORT</div>
      <div class="group">
        <div class="row" onclick="toast('피드백 창은 준비 중입니다')"><span class="lbl">피드백 보내기</span><span class="chev">›</span></div>
        <div class="row" onclick="toast('문의 창은 준비 중입니다')"><span class="lbl">문의하기</span><span class="chev">›</span></div>
        <div class="row" onclick="toast('약관 페이지는 준비 중입니다')"><span class="lbl">이용약관 · 개인정보</span><span class="chev">›</span></div>
      </div>

      <div class="ver">RL PROJECT · v0.1.0 (MVP) · 임시 화면</div>
    </div>

    <div class="nav">
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="lbl">안전가옥</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg><span class="lbl">인벤토리</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></svg><span class="lbl">출정</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="lbl">캐릭터</span></div>
      <div class="ni on"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">설정</span></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    let loggedIn = true;
    let lang = 'ko';
    const LANGS = [['ko','한국어'],['en','English'],['ja','日本語']];
    const userSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    const checkSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    function renderAcct(){
      const g = document.getElementById('acct-group');
      if(loggedIn){
        g.innerHTML = `<div class="acct">
          <span class="avatar">${userSvg}</span>
          <span class="who"><div class="nm">생존자 K-072</div><div class="id">survivor072@rl.net</div></span>
          <button class="authbtn out" onclick="toggleAuth()">로그아웃</button>
        </div>`;
      } else {
        g.innerHTML = `<div class="acct">
          <span class="avatar">${userSvg}</span>
          <span class="who"><div class="nm">로그인되지 않음</div><div class="id">진행 상황이 저장되지 않습니다</div></span>
          <button class="authbtn in" onclick="toggleAuth()">로그인</button>
        </div>`;
      }
    }
    function toggleAuth(){ loggedIn = !loggedIn; renderAcct(); toast(loggedIn?'로그인되었습니다':'로그아웃되었습니다'); }

    function renderLang(){
      document.getElementById('lang-group').innerHTML = LANGS.map(([k,label])=>
        `<div class="lang${k===lang?' on':''}" onclick="setLang('${k}')"><span class="lbl">${label}</span><span class="check">${checkSvg}</span></div>`).join('');
    }
    function setLang(k){ lang = k; renderLang(); toast('언어가 변경되었습니다'); }

    let toastTimer;
    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
    }

    renderAcct(); renderLang();
  </script>
</body>
</html>
