<!-- @dsCard group="Screens" viewport="430x800" name="S3 · 출정 (존 선택)" subtitle="Horizontal city cards + zone list + sortie CTA" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-void);font-family:var(--font-ui);color:var(--text-hi);display:flex;justify-content:center;padding:16px}
  .phone{width:390px;background:var(--bg-base);border:1px solid var(--line-1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:760px}

  .top{padding:18px 18px 12px}
  .h1{font-size:23px;font-weight:600;letter-spacing:var(--tr-tight)}
  .h1 .sub{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-lo);letter-spacing:var(--tr-label);margin-top:4px;font-weight:400}

  .content{flex:1;overflow:hidden;display:flex;flex-direction:column}

  .kick{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:var(--tr-label);padding:0 18px 9px}

  /* horizontal city cards */
  .cities{display:flex;gap:12px;overflow-x:auto;padding:0 18px 6px;scrollbar-width:none}
  .cities::-webkit-scrollbar{display:none}
  .city{flex:0 0 216px;background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-card);overflow:hidden}
  .city.on{border-color:var(--line-2);background:var(--surface-2)}
  .city.lock{opacity:.5}
  .banner{position:relative;height:82px;background:
    repeating-linear-gradient(135deg, oklch(0.26 0.008 264) 0 8px, oklch(0.23 0.007 264) 8px 16px)}
  .banner .tier{position:absolute;left:11px;top:10px;font-family:var(--font-mono);font-size:9px;letter-spacing:var(--tr-wide);color:var(--text-mid);background:oklch(0.15 0.006 264 / .6);border:1px solid var(--line-2);border-radius:var(--r-chip);padding:2px 6px}
  .banner .ph{position:absolute;right:11px;bottom:9px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);letter-spacing:var(--tr-label)}
  .banner .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-lo)}
  .banner .lk svg{width:22px;height:22px;stroke-width:1.75}
  .cbody{padding:11px 13px 13px}
  .cnm{font-size:15px;font-weight:600}
  .cmeta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);margin-top:4px}
  .loot{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-family:var(--font-mono);font-size:10px;color:var(--text-mid);background:var(--surface-3);border-radius:var(--r-chip);padding:3px 8px}
  .loot .dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--sato)}

  /* zone list */
  .zones{flex:1;overflow-y:auto;margin-top:14px;border-top:1px solid var(--line-1)}
  .zsec{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);letter-spacing:var(--tr-label);padding:12px 18px 6px;background:var(--surface-1)}
  .zlist{padding:0 16px}
  .zrow{display:flex;align-items:flex-start;gap:11px;min-height:58px;padding:12px 4px;border-top:1px solid var(--line-1);cursor:pointer}
  .zrow:first-child{border-top:0}
  .zrow:hover{background:var(--surface-1)}
  .zrow.hidden{cursor:default}
  .zrow.hidden:hover{background:transparent}
  .zlead{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .zp{font-size:14.5px;color:var(--text-hi)}
  .zrow.hidden .zp{color:var(--text-lo)}
  .zs{font-size:12px;color:var(--text-lo);line-height:1.45}
  .zrow.hidden .zs{color:var(--text-faint)}
  .ztrail{margin-left:auto;flex:0 0 auto;align-self:center}
  .unlockbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:11.5px;font-weight:500;padding:7px 11px;border-radius:var(--r-input);border:1px solid var(--line-1);background:var(--surface-2);color:var(--text-faint);cursor:not-allowed}
  .unlockbtn svg{width:13px;height:13px;stroke-width:2}
  .unlockbtn:not([disabled]){color:var(--text-hi);border-color:var(--line-2);background:var(--surface-3);cursor:pointer}

  /* zone toast modal */
  .pop{position:absolute;inset:0;display:none;align-items:flex-end;z-index:5}
  .pop.open{display:flex}
  .pop .scrim{position:absolute;inset:0;background:var(--scrim)}
  .sheet{position:relative;width:100%;background:var(--surface-1);border-top:1px solid var(--line-2);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--shadow-sheet);padding-bottom:18px}
  .grip{height:24px;display:flex;align-items:center;justify-content:center}
  .grip span{width:38px;height:4px;border-radius:var(--r-pill);background:oklch(0.9 0 0 / .3)}
  .dart{position:relative;height:150px;background:var(--surface-3);overflow:hidden}
  .dart .ph{width:100%;height:100%;background:repeating-linear-gradient(135deg, oklch(0.26 0.008 264) 0 9px, oklch(0.23 0.007 264) 9px 18px);display:flex;align-items:center;justify-content:center}
  .dart .ph span{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);letter-spacing:var(--tr-label)}
  .dart::after{content:"";position:absolute;inset:auto 0 0 0;height:46px;background:linear-gradient(to bottom,transparent,var(--surface-1))}
  .dhead{display:flex;align-items:center;gap:9px;padding:12px 18px 6px}
  .dnm{font-size:18px;font-weight:600}
  .dcat{font-family:var(--font-mono);font-size:10px;color:var(--text-lo);letter-spacing:var(--tr-label)}
  .ddesc{padding:0 18px 16px;font-size:13px;color:var(--text-mid);line-height:1.55}
  .dcta{margin:0 16px;width:calc(100% - 32px);font-size:15px;font-weight:600;padding:15px;border-radius:var(--r-input);border:1px solid var(--danger);background:var(--surface-3);color:var(--text-hi);cursor:pointer}

  .nav{border-top:1px solid var(--line-1);background:var(--surface-1);display:flex;padding:8px 4px 10px}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--text-lo);position:relative}
  .ni.on{color:var(--text-hi)}
  .ni.on::before{content:"";position:absolute;top:0;width:20px;height:2px;border-radius:var(--r-pill);background:var(--text-hi)}
  .ni svg{width:20px;height:20px;stroke-width:1.75}
  .ni .lbl{font-size:10px;font-weight:500}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="h1">출정<span class="sub">SORTIE · 도시 선택</span></div>
    </div>
    <div class="content">
      <div class="kick">도시 · 난이도 티어</div>
      <div class="cities">
        <div class="city on">
          <div class="banner"><span class="tier">TIER I</span><span class="ph">CITY ART</span></div>
          <div class="cbody"><div class="cnm">도시 1</div><div class="cmeta">존 4 · 개방</div><span class="loot"><span class="dot"></span>전리품 · 금속</span></div>
        </div>
        <div class="city">
          <div class="banner"><span class="tier">TIER II</span><span class="ph">CITY ART</span></div>
          <div class="cbody"><div class="cnm">도시 2</div><div class="cmeta">존 5 · 개방</div><span class="loot"><span class="dot"></span>전리품 · 약품</span></div>
        </div>
        <div class="city lock">
          <div class="banner"><span class="lk"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
          <div class="cbody"><div class="cnm">도시 3</div><div class="cmeta">존 6 · 잠금</div><span class="loot">해제 · 평판 필요</span></div>
        </div>
      </div>

      <div class="zones">
        <div class="zsec">존 · 도시 1</div>
        <div class="zlist">
          <div class="zrow" onclick="openZone('flood')">
            <div class="zlead"><span class="zp">침수 터널</span><span class="zs">무릎까지 물이 찬 폐수로. 위협은 적지만 정크·금속 위주로만 나온다.</span></div>
          </div>
          <div class="zrow" onclick="openZone('filter')">
            <div class="zlead"><span class="zp">폐 정수장</span><span class="zs">낡은 여과 설비가 늘어선 구역. 부품이 나오지만 개체가 거세다.</span></div>
          </div>
          <div class="zrow hidden">
            <div class="zlead"><span class="zp">봉쇄 구획</span><span class="zs">하수도 카드키로만 진입. 고가 전리품 · 고위험.</span></div>
            <div class="ztrail"><button class="unlockbtn" disabled><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>잠금 해제</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="nav">
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="lbl">안전가옥</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg><span class="lbl">인벤토리</span></div>
      <div class="ni on"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></svg><span class="lbl">출정</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="lbl">캐릭터</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">설정</span></div>
    </div>

    <div class="pop" id="pop">
      <div class="scrim" onclick="closeZone()"></div>
      <div class="sheet">
        <div class="grip"><span></span></div>
        <div class="dart"><div class="ph"><span id="z-art">존 · IMAGE</span></div></div>
        <div class="dhead"><span class="dnm" id="z-nm"></span><span class="dcat" id="z-cat"></span></div>
        <div class="ddesc" id="z-desc"></div>
        <button class="dcta" onclick="closeZone()">출정하기</button>
      </div>
    </div>
  </div>
  <script>
    const ZONES = {
      flood:{name:'침수 터널', cat:'난이도 낮음 · 정크·금속', desc:'3구역 하수도와 연결된 폐수로. 무릎까지 물이 차 이동이 느리지만 위협 개체는 적다. 정크·금속 전리품 위주로 나온다.'},
      filter:{name:'폐 정수장', cat:'난이도 보통 · 부품·기계류', desc:'가동을 멈춘 여과 설비가 늘어선 대형 구역. 부품·기계류 전리품이 풍부하지만 감염 개체가 무리 지어 다니므로 주의해야 한다.'},
    };
    function openZone(key){
      const z = ZONES[key];
      document.getElementById('z-art').textContent = z.name + ' · IMAGE';
      document.getElementById('z-nm').textContent = z.name;
      document.getElementById('z-cat').textContent = z.cat;
      document.getElementById('z-desc').textContent = z.desc;
      document.getElementById('pop').classList.add('open');
    }
    function closeZone(){ document.getElementById('pop').classList.remove('open'); }
  </script>
</body>
</html>
