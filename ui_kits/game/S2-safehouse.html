<!-- @dsCard group="Screens" viewport="430x800" name="S2 · 안전가옥 (상점)" subtitle="Vendors residing in the safehouse — tap a shop to enter the NPC screen" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-void);font-family:var(--font-ui);color:var(--text-hi);display:flex;justify-content:center;padding:16px}
  .phone{width:390px;background:var(--bg-base);border:1px solid var(--line-1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:760px}

  .top{padding:18px 18px 14px;display:flex;align-items:flex-start}
  .h1{font-size:23px;font-weight:600;letter-spacing:var(--tr-tight)}
  .h1 .sub{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-lo);letter-spacing:var(--tr-label);margin-top:4px;font-weight:400}
  .bal{margin-left:auto;text-align:right}
  .bal .k{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--text-lo);letter-spacing:var(--tr-label)}
  .bal .v{font-family:var(--font-mono);font-size:18px;color:var(--sato);font-variant-numeric:tabular-nums}

  .content{flex:1;overflow-y:auto;padding:0 16px 16px}
  .content::-webkit-scrollbar{display:none}
  .kick{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:var(--tr-label);padding:2px 2px 12px}

  .vendor{background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-card);overflow:hidden;margin-bottom:12px}
  .vbanner{position:relative;height:110px;background:var(--surface-3)}
  .vbanner img{width:100%;height:100%;object-fit:cover;display:block}
  .vbanner::after{content:"";position:absolute;inset:auto 0 0 0;height:44px;background:linear-gradient(to bottom,transparent,var(--surface-1))}

  .vbody{padding:12px 15px}
  .vhead{display:flex;align-items:center;gap:10px}
  .vtitle{display:flex;flex-direction:column;gap:2px;min-width:0}
  .shop{font-size:16px;font-weight:600}
  .npc{font-family:var(--font-mono);font-size:11px;color:var(--text-lo)}
  .tag{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mid);background:var(--surface-3);border:1px solid var(--line-1);border-radius:var(--r-chip);padding:4px 9px}
  .tag .dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--text-lo)}

  .vdesc{font-size:13px;color:var(--text-mid);line-height:1.55;margin-top:11px;text-wrap:pretty}
  .vfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-1)}
  .offers{font-family:var(--font-mono);font-size:10.5px;color:var(--text-lo);letter-spacing:var(--tr-label)}

  .nav{border-top:1px solid var(--line-1);background:var(--surface-1);display:flex;padding:8px 4px 10px}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--text-lo);position:relative}
  .ni.on{color:var(--text-hi)}
  .ni.on::before{content:"";position:absolute;top:0;width:20px;height:2px;border-radius:var(--r-pill);background:var(--text-hi)}
  .ni svg{width:20px;height:20px;stroke-width:1.75}
  .ni .lbl{font-size:10px;font-weight:500}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="h1">안전가옥<span class="sub">SAFEHOUSE · 상점</span></div>
    </div>
    <div class="content">
      <div class="kick">상점 · 안전가옥에 상주하는 상인</div>

      <div class="vendor">
        <div class="vbanner"><img src="../../assets/shops/clinic.jpg" alt="보건소"></div>
        <div class="vbody">
          <div class="vhead">
            <div class="vtitle"><span class="shop">보건소</span><span class="npc">유리 소콜로프</span></div>
            <span class="tag"><span class="dot"></span>약품</span>
          </div>
          <div class="vdesc">보건소를 지키는 전직 군의관. 말수가 적고 손이 정확하다. 약값은 깎아주지 않지만, 위독한 자는 그냥 눕혀준다.</div>
          <div class="vfoot"><span class="offers">구매 · 판매 · 퀘스트</span></div>
        </div>
      </div>

      <div class="vendor">
        <div class="vbanner"><img src="../../assets/shops/hardware.jpg" alt="철물점"></div>
        <div class="vbody">
          <div class="vhead">
            <div class="vtitle"><span class="shop">철물점</span><span class="npc">딘 카터</span></div>
            <span class="tag"><span class="dot"></span>정크·부품</span>
          </div>
          <div class="vdesc">철물점의 고물상. 고철 더미 속에서 뭐든 찾아내는 수완가. 농담이 많지만 흥정엔 빈틈이 없다.</div>
          <div class="vfoot"><span class="offers">구매 · 판매 · 퀘스트</span></div>
        </div>
      </div>
    </div>

    <div class="nav">
      <div class="ni on"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="lbl">안전가옥</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg><span class="lbl">인벤토리</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></svg><span class="lbl">출정</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="lbl">캐릭터</span></div>
      <div class="ni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">설정</span></div>
    </div>
  </div>
</body>
</html>
