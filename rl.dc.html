<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874}}">
const h = React.createElement;
const T = {
  void:'oklch(0.150 0.006 264)', bg:'oklch(0.185 0.006 264)', s1:'oklch(0.215 0.007 264)',
  s2:'oklch(0.255 0.008 264)', s3:'oklch(0.300 0.009 264)', line:'oklch(0.340 0.008 264)',
  line2:'oklch(0.420 0.010 264)', hi:'oklch(0.940 0.004 264)', mid:'oklch(0.740 0.006 264)',
  lo:'oklch(0.550 0.008 264)', faint:'oklch(0.420 0.008 264)', danger:'oklch(0.620 0.120 28)',
  warn:'oklch(0.740 0.085 72)', good:'oklch(0.720 0.078 148)', sato:'oklch(0.740 0.055 224)',
  hp:'oklch(0.580 0.100 25)', sta:'oklch(0.720 0.075 74)', growth:'oklch(0.660 0.045 264)',
  dur:'oklch(0.740 0.012 250)', bleed:'oklch(0.640 0.120 28)', stun:'oklch(0.800 0.090 88)',
  pierce:'oklch(0.700 0.055 232)', rupture:'oklch(0.660 0.090 330)',
  mono:"'IBM Plex Mono',monospace", sans:"'IBM Plex Sans KR',sans-serif"
};
const ATTR = { bleed:{kr:'출혈',c:T.bleed}, stun:{kr:'기절',c:T.stun}, pierce:{kr:'관통',c:T.pierce}, rupture:{kr:'파열',c:T.rupture}, sever:{kr:'절단',c:T.mid} };
// safe lookup — items/monsters may carry an Attribute like "none" or a value absent from the map
const AT = (x)=> (x && ATTR[x]) ? ATTR[x] : null;
const CATKR = { Weapon:'무기', Head:'투구', Body:'갑옷', Medicine:'약품', Food:'음식', Junk:'정크', Quest:'퀘스트', Key:'키', Artifact:'아티팩트', Artifact_Worn:'아티팩트', Artifact_Carried:'아티팩트', USB:'USB', Material:'재료' };
// tiny inline icons
const ICON = {
  home:'M3 11.5 12 4l9 7.5M5 10v10h14V10',
  pkg:'M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10',
  cross:'M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 100 8 4 4 0 000-8z',
  user:'M12 12a4 4 0 100-8 4 4 0 000 8zM5 20c0-3.5 3-6 7-6s7 2.5 7 6',
  gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM19 12l1.5 1-1.5 2.6-1.8-.5-1.5.9-.4 1.9h-3l-.4-1.9-1.5-.9-1.8.5L5 15l1.5-1L6 12l-1.5-1L6 8.4l1.8.5 1.5-.9L9.7 6h3l.4 1.9 1.5.9 1.8-.5L18 8.4 16.5 10z',
  wrench:'M14.6 6.3a3.5 3.5 0 0 0-4.8 4.6l-6 6 2.7 2.7 6-6a3.5 3.5 0 0 0 4.6-4.8l-2.2 2.2-2.3-.6-.6-2.3 2.6-2z'
};
const svg = (d,sz=20,c='currentColor',sw=1.6)=>h('svg',{width:sz,height:sz,viewBox:'0 0 24 24',fill:'none',stroke:c,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d}));

class Component extends DCLogic {
  state = { ready:false, screen:'safehouse', modalZone:null, sel:null, seg:'bag', filter:'전체', toast:null, repairSel:null, moveQty:null, vendor:null, vtab:'buy', combatSheet:null };
  async componentDidMount(){
    try{
      const eng = await import('./engine.js');
      const loader = await import('./sheet-loader.js');
      this.eng = eng; this.loader = loader; this.dataSrc = 'bundled';
      let savedLang='kr'; try{ savedLang=localStorage.getItem('rl_lang')||'kr'; }catch(_){}
      eng.setLang(savedLang); this.lang=savedLang;
      await this.loadData();
      this.newRun(true);
      this.setState({ ready:true });
    }catch(e){ console.error('engine load failed', e); this.setState({ ready:true, err:String(e) }); }
  }
  async loadData(){
    try{
      const rows = await this.loader.fetchAllTabs();
      this.eng.setDATA(this.loader.shape(rows));
      try{ localStorage.setItem('rl_sheet_cache_v2', JSON.stringify(rows)); }catch(_){}
      this.dataSrc = 'live'; return 'live';
    }catch(e){
      console.warn('live sheet fetch failed, falling back', e);
      try{ const c = localStorage.getItem('rl_sheet_cache_v2'); if(c){ this.eng.setDATA(this.loader.shape(JSON.parse(c))); this.dataSrc='cache'; return 'cache'; } }catch(_){}
      this.dataSrc = 'bundled'; return 'bundled';
    }
  }
  clearCache(){ let n=0; try{ if(localStorage.getItem('rl_sheet_cache_v2')!=null){ localStorage.removeItem('rl_sheet_cache_v2'); n++; } }catch(_){}
    this.flash(n?this.t('data_cache_cleared'):this.t('data_no_cache')); this.forceUpdate(); }
  async reloadSheet(){
    this.flash(this.t('data_sheet_loading'));
    const src = await this.loadData();
    this.newRun(true); this.combat=null; this.go('safehouse');
    this.flash(src==='live'?this.t('data_sheet_applied'):src==='cache'?this.t('data_conn_fail_cache'):this.t('data_use_bundle'));
  }
  componentWillUnmount(){ if(this._t) clearInterval(this._t); if(this._ut) clearInterval(this._ut); }
  componentDidUpdate(){ if(this.logRef){ this.logRef.scrollTop = this.logRef.scrollHeight; } }

  newRun(fresh){
    const gs = this.eng.startingState();
    const full = this.eng.playerProfile(gs,false);
    this.staMax = 10;
    gs.maxHp = full.maxHp; gs.hp = full.maxHp; gs.sta = this.staMax;
    this.gs = gs; this.combat = null;
    // equipped gear is 'carried' — it lives in 소지품(bag), never in 금고(vault)
    ['weapon','head','body'].forEach(s=>{ if(gs.equip[s]) this.moveToBag(gs.equip[s]); });
  }
  moveToBag(uid){ const i=this.gs.vault.findIndex(x=>x.uid===uid); if(i>=0){ const [it]=this.gs.vault.splice(i,1); this.gs.bag.push(it); } }
  rest(){ const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=full.maxHp; this.gs.sta=this.staMax; }
  go(screen){ if(this._t){clearInterval(this._t); this._t=null;} if(this._ut){clearInterval(this._ut); this._ut=null;} this.setState({ screen, modalZone:null, sel:null }); }
  flash(msg){ this.setState({toast:msg}); clearTimeout(this._ft); this._ft=setTimeout(()=>this.setState({toast:null}),1600); }

  // ---------- sortie / combat ----------
  zonePool(zoneId){
    const direct=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').map(s=>s.trim()).includes(zoneId));
    if(direct.length) return direct;
    // no explicit pool (e.g. hidden zone) -> auto-populate from the same city's monsters
    const z=this.eng.byId.zone[zoneId];
    if(z){ const pool=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').some(s=>{ const zz=this.eng.byId.zone[s.trim()]; return zz&&zz.CityID===z.CityID; })); if(pool.length) return pool; }
    return this.eng.DATA.monsters;
  }
  hasItem(id){ return this.gs.vault.some(x=>x.id===id)||this.gs.bag.some(x=>x.id===id); }
  consumeItem(id){ const dec=(arr)=>{ const i=arr.findIndex(x=>x.id===id); if(i<0) return false; if(arr[i].qty>1) arr[i].qty--; else arr.splice(i,1); return true; }; return dec(this.gs.bag)||dec(this.gs.vault); }
  startSortie(zoneId){
    const z=this.eng.byId.zone[zoneId];
    if(z && this.eng.N(z.IsHidden)===1 && z.UnlockType==='item' && z.UnlockKey){ this.consumeItem(z.UnlockKey); this.flash(this.t('zone_keycard_used')); }
    this.combat = { zoneId, encounter:0, runLoot:[] };
    // 귀환 화면 성장 그래프용 — 출정 시작 시점 스냅샷
    this.combat.gSnap = Object.fromEntries(['str','dex','vit','will'].map(k=>[k,{ level:this.gs.growth[k].level, pct:this.eng.growthPct(this.gs,k) }]));
    this.setState({ screen:'combat', modalZone:null });
    this.drawCards();
  }
  drawCards(){
    const n = this.eng.N(this.eng.DATA.config.combat_card_count, 3);
    const zone = this.eng.byId.zone[this.combat.zoneId];
    const isPvp = this.isPvpZone(zone);
    const userChance = zone ? this.eng.N(String(zone.UserDataChance==null?'':zone.UserDataChance).replace('%',''))/100 : 0;
    // 조우 카드: PvP 존에서는 각 카드가 UserDataChance(%)로 몬스터/유저(콜드데이터) 확정 (§6-6)
    const cards = this.eng.drawCards(this.combat.zoneId, n).map(id=>{
      if(isPvp && Math.random()<userChance){
        const bot=this.eng.pickColdOpponent(this.gs, zone.CityID);
        if(bot) return { type:'user', bot };
      }
      return { type:'monster', id };
    });
    Object.assign(this.combat, { cards, picked:null, mProf:null, pvp:null, pvpCards:null, phase:'cards', res:null, revealed:0, loot:[], ups:[], cardFocus:Math.floor(n/2), flipped:false });
    if(this._t){ clearInterval(this._t); this._t=null; }
    this.forceUpdate();
  }
  pickCard(i){
    const card=this.combat.cards[i]; if(!card) return;
    if(card.type==='user'){ Object.assign(this.combat, { picked:i, pvp:card.bot, mProf:this.eng.coldProfile(card.bot), phase:'preview' }); }
    else { const m=this.eng.byId.monster[card.id]; if(!m) return; Object.assign(this.combat, { picked:i, pvp:null, mProf:this.eng.monsterProfile(m), phase:'preview' }); }
    this.forceUpdate();
  }
  enterCombat(){
    const mProf = this.combat.mProf;
    this.gs.sta = Math.max(0, this.gs.sta - mProf.staminaCost);
    const staZero = this.gs.sta <= 0;
    const full = this.eng.playerProfile(this.gs,false);
    const prof = this.eng.playerProfile(this.gs, staZero); prof.maxHp = full.maxHp;
    const res = this.eng.simulateCombat(prof, mProf, this.gs.hp);
    Object.assign(this.combat, { prof:full, res, revealed:1, phase:'fighting', staZero, encounter:this.combat.encounter+1 });
    this.forceUpdate();
    if(this._t) clearInterval(this._t);
    this._t = setInterval(()=>this.tick(), 300);
  }
  tick(){
    const c=this.combat;
    if(c.revealed < c.res.log.length){ c.revealed++; this.forceUpdate(); }
    else { clearInterval(this._t); this._t=null; this.finishCombat(); }
  }
  finishCombat(){
    const c=this.combat, res=c.res;
    this.gs.hp = res.playerHpEnd;
    c.durChanges = this.eng.applyDurabilityWear(this.gs, res.triggers) || [];
    // ---- PvP(콜드데이터) 승패는 카드 트랙으로만 처리 (§6-6, death_durability_loss 미적용) ----
    if(c.pvp){
      if(res.winner==='player'){
        c.ups = this.eng.applyGrowth(this.gs, res.triggers);
        const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
        this.setupPvpReward(); c.phase='pvpWin';
      } else if(res.winner==='monster'){ this.setupPvpFlee(); c.phase='pvpLose'; }
      else { c.phase='timeout'; }
      this.forceUpdate(); return;
    }
    if(res.winner==='player'){
      const loot = this.eng.rollLoot(c.mProf.id);
      // quest drop: the police keycard is carried by 하람의 파수꾼 (assigned drop, not a global roll)
      if(c.mProf.id==='monster_haram_warden' && !this.hasItem('item_police_keycard') && Math.random()<0.35){ loot.push({id:'item_police_keycard', qty:1}); }
      for(const l of loot){ this.addToBag(l.id, l.qty); c.runLoot.push(l); }
      c.loot = loot;
      if(loot.length){ c.res.log.push({t:res.elapsed||0, who:'sys', type:'win', text:this.eng.logTpl('loot',{}), hpP:res.playerHpEnd, hpM:0}); c.revealed=c.res.log.length; }
      c.ups = this.eng.applyGrowth(this.gs, res.triggers);
      const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
      c.phase='won';
    } else if(res.winner==='monster'){ c.phase='dead'; }
    else { c.phase='timeout'; }
    this.forceUpdate();
  }
  addToBag(id, qty){
    const src = this.eng.byId.item[id];
    if(src && this.eng.N(src.MaxStack,1)>1){
      const ex = this.gs.bag.find(x=>x.id===id);
      if(ex){ ex.qty+=qty; return; }
    }
    for(let i=0;i<qty;i++){ const inst=this.eng.mkInstance(id,1); this.gs.bag.push(inst); if(this.eng.N((src||{}).MaxStack,1)>1){ inst.qty=qty; break; } }
  }
  extract(){ this.setState({ screen:'result' }); this.combat.result='extract'; if(this._t){clearInterval(this._t);this._t=null;} this.forceUpdate(); }
  death(){
    // 소지품(bag)은 전부 잃되, 착용 중인 장비는 유지된다
    this.gs.bag = this.gs.bag.filter(x=>this.isEquipped(x.uid));
    const eq = [this.gs.equip.weapon,this.gs.equip.head,this.gs.equip.body,this.gs.equip.artifact1,this.gs.equip.artifact2].filter(Boolean);
    let broke=null;
    if(eq.length){ const uid=eq[Math.floor(Math.random()*eq.length)]; const inst=this.eng.instById(this.gs,uid);
      // 사망 시 장비는 this.t('item_current_durability')만 손상된다 — 최대 내구도는 수리 실패로만 영구 감소한다
      if(inst){ inst.dur=Math.max(0,(inst.dur||0)-this.eng.R.randInt(2,5)); broke=inst; } }
    this.combat.result='death'; this.combat.broke=broke;
    this.setState({ screen:'result' });
  }
  toSafehouse(){ this.gs.sorties++; this.combat=null; this.go('safehouse'); }

  // ---------- inventory ----------
  moveItem(uid){
    const merge=(dst,inst)=>{ const src=this.eng.byId.item[inst.id]; if(src&&this.eng.N(src.MaxStack,1)>1){ const ex=dst.find(x=>x.id===inst.id); if(ex){ ex.qty=(ex.qty||1)+(inst.qty||1); return true; } } return false; };
    const inV = this.gs.vault.findIndex(x=>x.uid===uid);
    if(inV>=0){ const [it]=this.gs.vault.splice(inV,1); if(!merge(this.gs.bag,it)) this.gs.bag.push(it); }
    else { const inB=this.gs.bag.findIndex(x=>x.uid===uid); if(inB>=0){
      // 착용 중인 장비는 금고로 보낼 수 없다 — 옮기면 자동 해제
      if(this.isEquipped(uid)){ const e=this.gs.equip; ['weapon','head','body','artifact1','artifact2'].forEach(s=>{ if(e[s]===uid) e[s]=null; }); const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=Math.min(this.gs.hp,this.gs.maxHp); }
      const [it]=this.gs.bag.splice(inB,1); if(!merge(this.gs.vault,it)) this.gs.vault.push(it);
    } }
    this.forceUpdate();
  }
  // ---------- move / vendor helpers ----------
  moveStack(uid, n){
    const inVault=this.gs.vault.some(x=>x.uid===uid);
    const src=inVault?this.gs.vault:this.gs.bag, dst=inVault?this.gs.bag:this.gs.vault;
    const i=src.findIndex(x=>x.uid===uid); if(i<0) return;
    const inst=src[i]; const total=inst.qty||1;
    n=Math.max(1,Math.min(n||total,total));
    if(n>=total){ this.moveItem(uid); return; }
    inst.qty-=n;
    const ex=dst.find(x=>x.id===inst.id);
    if(ex){ ex.qty=(ex.qty||1)+n; } else { const ni=this.eng.mkInstance(inst.id,n); ni.qty=n; dst.push(ni); }
    this.forceUpdate();
  }
  services(v){ return String((v&&v.Services)||'').split(',').map(s=>s.trim()).filter(Boolean); }
  tx(row,base){ return this.eng?this.eng.tr(row,base):''; }
  t(k){ return this.eng?this.eng.t(k):k; }
  en(){ return !!this.eng && this.eng.LANG==='en'; }
  isPvpZone(z){ if(!z) return false; const v=String(z.IsPvP==null?'':z.IsPvP).trim().toLowerCase(); return v==='1'||v==='true'||v==='y'||v==='yes'; }
  setLang(l){ this.lang=l; this.eng.setLang(l); try{localStorage.setItem('rl_lang',l);}catch(_){} this.forceUpdate(); }
  openVendor(id){ const v=this.eng.byId.vendor[id]; const svc=this.services(v); const first=svc.includes('Buy')?'buy':svc.includes('Repair')?'repair':svc.includes('Heal')?'heal':svc.includes('Load')?'load':'sell'; if(this._t){clearInterval(this._t);this._t=null;}
    if(svc.includes('Load')){
      const up=this.gs.usbUpload;
      if(up&&Date.now()>=up.endsAt){ this.usb={stage:'uploading',row:this.usbRowFor(up.usbId)}; this.completeUpload(); }
      else if(up){ this.usb={stage:'uploading',row:this.usbRowFor(up.usbId)}; this.usb.line=this.eng.usbLine('uploading',this.usb.row); }
      else { this.usb={stage:'intro',row:null,line:this.eng.usbLine('intro',null)}; }
    }
    this.setState({screen:'vendor',vendor:id,vtab:first,sel:null,repairSel:null,modalZone:null}); }
  // ---------- shop ----------
  buy(shopId, row){
    const price=this.eng.N(row.BuyPrice);
    const key=shopId+'|'+row.ItemID;
    const stock = this.gs.shopStock[key]!=null ? this.gs.shopStock[key] : this.eng.N(row.StockMax,99);
    if(this.gs.sato < price){ this.flash(this.t('shop_insufficient_sato')); return; }
    if(stock<=0){ this.flash(this.t('shop_out_of_stock')); return; }
    this.gs.sato -= price; this.gs.shopStock[key]=stock-1; this.addToVault(row.ItemID,1);
    this.flash((this.tx(row,'ItemName')||this.eng.anyName(row.ItemID))+(this.en()?' bought':' 구매')); this.forceUpdate();
  }
  addToVault(id,qty){ const src=this.eng.byId.item[id];
    if(src && this.eng.N(src.MaxStack,1)>1){ const ex=this.gs.vault.find(x=>x.id===id); if(ex){ex.qty+=qty;return;} }
    const inst=this.eng.mkInstance(id,qty); this.gs.vault.push(inst); }

  // ================= RENDER =================
  renderVals(){ let screenEl; try{ screenEl = this.state.ready ? this.renderApp() : this.loading(); }catch(e){ console.error('renderApp threw:', e); screenEl = this.loading(); } return { screenEl }; }
  loading(){ return this.phone(h('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:T.lo,fontFamily:T.mono,fontSize:13}}, this.state && this.state.err ? ((this.eng?this.t('frag_error'):'오류:')+' '+this.state.err) : (this.eng?this.t('common_loading'):'불러오는 중…'))); }
  phone(...kids){ return h('div',{style:{width:'min(402px, 100vw)',height:'min(874px, 100dvh)',background:T.bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative',boxShadow:'0 24px 80px rgba(0,0,0,.6)',border:'1px solid '+T.line}}, ...kids); }

  bar(label, val, max, color){
    const pct = max>0 ? Math.max(0,Math.min(100,(val/max)*100)) : 0;
    return h('div',{style:{flex:1}},
      h('div',{style:{display:'flex',justifyContent:'space-between',fontFamily:T.mono,fontSize:10,letterSpacing:'.05em',color:T.lo,marginBottom:4}}, h('span',null,label), h('span',{style:{color:T.mid}}, Math.round(val)+' / '+Math.round(max))),
      h('div',{style:{height:6,background:T.s3,borderRadius:1,overflow:'hidden'}}, h('div',{style:{width:pct+'%',height:'100%',background:color}}))

    this.gs.sato+=p; const dec=(arr)=>{const i=arr.findIndex(x=>x.uid===inst.uid);if(i<0)return false; if((arr[i].qty||1)>1)arr[i].qty--; else arr.splice(i,1); return true;}; dec(this.gs.vault)||dec(this.gs.bag);
    this.flash(this.eng.anyName(inst.id)+(' '+this.t('frag_sell_plus'))+p); this.forceUpdate(); }
  vendorSell(v){
    const list=this.sellables(v);
    return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:20}},
      h('div',{style:{padding:'10px 18px 2px',fontFamily:T.mono,fontSize:10,letterSpacing:'.1em',color:T.faint}}, (this.t('frag_tradable')+' ')+(v.TradeCategories||'—')),
      list.length? list.map(inst=>{ const p=this.sellPrice(inst); const inVault=this.gs.vault.some(x=>x.uid===inst.uid); const can=p>0&&!this.isEquipped(inst.uid);
        return h('div',{key:inst.uid,style:{display:'flex',alignItems:'center',gap:10,padding:'13px 18px',borderBottom:'1px solid '+T.line}},
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:2,flexWrap:'wrap'}}, this.chip(inVault?this.t('nav_vault'):this.t('nav_belongings'), inVault?T.good:T.warn), h('span',{style:{fontFamily:T.sans,fontSize:14,fontWeight:600,color:T.hi}}, this.itemLabel(inst)), inst.qty>1?h('span',{style:{fontFamily:T.mono,fontSize:11,color:T.mid}},'×'+inst.qty):null),
            h('div',{style:{fontFamily:T.mono,fontSize:11,color:T.lo}}, p>0?((this.en()?(p+' '+this.t('currency_sato')+' each'):('개당 '+p+' '+this.t('currency_sato')))):this.t('shop_no_sale'))),
          h('button',{onClick:()=>this.sellItem(inst),disabled:!can,style:{flex:'0 0 auto',background:can?T.s2:'transparent',border:'1px solid '+(can?T.line2:T.line),color:can?T.hi:T.faint,fontFamily:T.mono,fontSize:12,fontWeight:600,padding:'8px 12px',borderRadius:3,cursor:can?'pointer':'default',display:'flex',flexDirection:'column',alignItems:'center',gap:1}}, h('span',{style:{color:can?T.sato:T.faint}}, p.toLocaleString()), h('span',{style:{fontSize:9,color:T.mid}},this.t('shop_sell')))); })
        : h('div',{style:{padding:'40px 18px',textAlign:'center',fontFamily:T.sans,fontSize:13,color:T.faint}}, this.t('shop_nothing_to_sell')));
  }
  healCooldown(){ return Math.max(1, this.eng.N(this.eng.DATA.config.heal_cooldown_sorties, 1)); }
  healAvailAt(){ return (this.gs.lastHealSortie==null)?0:(this.gs.lastHealSortie + this.healCooldown()); }
  healAvailable(){ return this.gs.sorties >= this.healAvailAt(); }
  healCost(){ return Math.max(0, Math.ceil((this.gs.maxHp - this.gs.hp) * this.eng.N(this.eng.DATA.config.heal_cost_per_hp, 2))); }
  doHeal(){ const g=this.gs; if(!this.healAvailable()){ this.flash(this.t('heal_not_yet')); return; } if(g.hp>=g.maxHp){ this.flash(this.t('heal_already_full')); return; } const cost=this.healCost(); if(g.sato<cost){ this.flash(this.t('shop_insufficient_sato')); return; } g.sato-=cost; g.hp=g.maxHp; g.lastHealSortie=g.sorties; this.flash(this.t('heal_done')); this.forceUpdate(); }
  vendorHeal(v){
    const g=this.gs; const cost=this.healCost(); const avail=this.healAvailable(); const cd=this.healCooldown();
    const full=g.hp>=g.maxHp; const aff=g.sato>=cost; const can=avail&&!full&&aff;
    const nextIn=avail?0:(this.healAvailAt()-g.sorties);
    const row=(k,val,col)=>h('div',{key:k,style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid '+T.line}}, h('span',{style:{fontFamily:T.sans,fontSize:13,color:T.mid}},k), h('span',{style:{fontFamily:T.mono,fontSize:13,color:col||T.hi}},val));
    return h('div',{style:{flex:1,overflowY:'auto',padding:'18px'}},
      h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.1em',color:T.faint,marginBottom:12}}, this.t('heal_full_label')),
      h('div',{style:{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}, this.bar(this.t('stat_hp'),g.hp,g.maxHp,T.hp)),
      h('div',{style:{background:T.s1,border:'1px solid '+T.line,borderRadius:4,padding:'4px 14px',marginBottom:16}},
        row(this.t('heal_amount'),(this.t('frag_hp_full')+Math.round(g.maxHp-g.hp)+')'), T.good),
        row(this.t('heal_cost'), cost.toLocaleString()+(' '+this.t('currency_sato')), aff?T.sato:T.danger),
        row(this.t('usage_condition'), (this.en()?('1 / '+cd+' sorties'):(cd+'출정당 1회')), T.mid),
        row(this.t('common_status'), avail?this.t('common_available'):((nextIn+(this.en()?' ':'')+this.t('frag_sorties_until'))), avail?T.good:T.warn)),
      h('button',{disabled:!can,onClick:can?()=>this.doHeal():null,style:{width:'100%',background:'transparent',border:'1px solid '+(can?T.good:T.line),color:can?T.good:T.faint,fontFamily:T.sans,fontSize:15,fontWeight:700,padding:'15px',borderRadius:4,cursor:can?'pointer':'default'}}, full?this.t('heal_already_full'):(!avail?((nextIn+(this.en()?' ':'')+this.t('frag_sorties_until'))):(!aff?this.t('shop_insufficient_sato'):this.t('heal_get')))));
  }
  vendorRepair(){
    const list=this.repairables();
    return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:20}},
      h('div',{style:{padding:'11px 18px 3px',fontFamily:T.sans,fontSize:11.5,color:T.warn,lineHeight:1.5}}, this.t('repair_explain')),
      list.length? list.map(inst=>this.repairRow(inst)) : h('div',{style:{padding:'40px 18px',textAlign:'center',fontFamily:T.sans,fontSize:13,color:T.faint}}, this.t('repair_none')));
  }
  settings(){
    const srcLabel = { live:this.t('data_sheet_live'), cache:this.t('data_cache_connfail'), bundled:this.t('data_bundle_snapshot') }[this.dataSrc]||'—';
    const srcColor = this.dataSrc==='live'?T.good:(this.dataSrc==='cache'?T.warn:T.lo);
    return h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      this.screenTitle('SETTINGS','설정'),
      h('div',{style:{padding:'0 18px',overflowY:'auto'}},
        h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.12em',color:T.faint,margin:'2px 0 10px'}}, this.t('data_balance')),
        h('div',{style:{background:T.s1,border:'1px solid '+T.line,borderRadius:4,padding:'13px 15px',marginBottom:12}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
            h('span',{style:{fontFamily:T.sans,fontSize:13,color:T.mid}}, this.t('data_source')),
            h('span',{style:{fontFamily:T.mono,fontSize:12,color:srcColor}}, srcLabel)),
          h('div',{style:{fontFamily:T.sans,fontSize:11.5,color:T.lo,lineHeight:1.5}}, this.t('data_sheet_help'))),
        h('button',{onClick:()=>this.reloadSheet(),style:{width:'100%',background:T.s2,border:'1px solid '+T.line2,color:T.hi,fontFamily:T.sans,fontSize:14,fontWeight:600,padding:'13px',borderRadius:4,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:26}},
          svg('M4 12a8 8 0 018-8 8 8 0 016 2.7M20 12a8 8 0 01-8 8 8 8 0 01-6-2.7M18 4v3h-3M6 20v-3h3',18,T.hi,1.7),this.t('data_reload_sheet')),
        h('button',{onClick:()=>this.clearCache(),style:{width:'100%',background:'transparent',border:'1px solid '+T.line2,color:T.mid,fontFamily:T.sans,fontSize:14,fontWeight:600,padding:'13px',borderRadius:4,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:8}},
          svg('M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13M10 11v6M14 11v6',18,T.mid,1.6),this.t('data_clear_cache')),
        h('div',{style:{fontFamily:T.sans,fontSize:11.5,color:T.lo,lineHeight:1.5,marginBottom:26}}, this.t('data_clear_cache_desc')),
        h('div',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.12em',color:T.faint,margin:'2px 0 10px'}}, this.t('settings_app')),
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid '+T.line}},
          h('div',null,
            h('div',{style:{fontFamily:T.sans,fontSize:14,color:T.hi}},this.t('settings_language')),
            h('div',{style:{fontFamily:T.sans,fontSize:11,color:T.lo,marginTop:2}},this.t('dev_en_check'))),
          h('div',{style:{display:'flex',border:'1px solid '+T.line2,borderRadius:4,overflow:'hidden'}},
            ...[['kr',this.t('lang_korean')],['en','English']].map(([k,l])=>h('button',{key:k,onClick:()=>this.setLang(k),style:{background:this.lang===k?T.s2:'transparent',border:'none',color:this.lang===k?T.hi:T.lo,fontFamily:T.sans,fontSize:12,fontWeight:600,padding:'8px 14px',cursor:'pointer'}},l)))),
        ...[[this.t('settings_account'),this.t('settings_login_logout')],[this.t('nav_feedback'),this.t('feedback_bug')]].map(([a,b])=>h('div',{key:a,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'15px 0',borderBottom:'1px solid '+T.line}}, h('span',{style:{fontFamily:T.sans,fontSize:14,color:T.hi}},a), h('span',{style:{fontFamily:T.sans,fontSize:13,color:T.lo}},b))),
        h('button',{onClick:()=>{this.newRun(true);this.setState({ready:true});this.go('safehouse');this.flash(this.t('settings_reset_char'));},style:{marginTop:22,width:'100%',background:'transparent',border:'1px solid '+T.danger,color:T.danger,fontFamily:T.sans,fontSize:14,fontWeight:600,padding:'13px',borderRadius:4,cursor:'pointer',marginBottom:20}}, this.t('settings_reset_progress')))
    );
  }
}
