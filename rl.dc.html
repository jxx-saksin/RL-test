class Component extends DCLogic {
  state = { ready:false, screen:'safehouse', modalZone:null, sel:null, seg:'bag', filter:'전체', toast:null, repairSel:null, moveQty:null, vendor:null, vtab:'buy', combatSheet:null };
  async componentDidMount(){
    try{
      const eng = await import('./engine.js');
      const loader = await import('./sheet-loader.js');
      this.eng = eng; this.loader = loader; this.dataSrc = 'bundled';
      let savedLang='kr'; try{ savedLang=localStorage.getItem('rl_lang')||'kr'; }catch(_){}
      eng.setLang(savedLang); this.lang=savedLang;
      await this.loadData();
      const sv=this.readSave();
      if(sv){ this.applySave(sv); this.setState({ ready:true, resumeBanner:true }); }
      else { this.newRun(true); this.setState({ ready:true }); }
      this.bootFromQuery();
    }catch(e){ console.error('engine load failed', e); this.setState({ ready:true, err:String(e) }); }
  }
  bootFromQuery(){
    let q; try{ q=new URLSearchParams(location.search); }catch(_){ return; }
    const screen=q.get('screen'); if(!screen) return;
    if(screen==='vendor'){ const id=q.get('vendor')||'vendor_clinic'; const vtab=q.get('vtab'); this.openVendor(id); if(vtab) this.setState({vtab}); }
    else this.go(screen);
  }
  async loadData(){
    try{
      const rows = await this.loader.fetchAllTabs();
      this.eng.setDATA(this.loader.shape(rows));
      try{ localStorage.setItem('rl_sheet_cache_v2', JSON.stringify(rows)); }catch(_){}
      this.dataSrc = 'live'; return 'live';
    }catch(e){
      console.warn('live sheet fetch failed, falling back', e);
      try{ const c = localStorage.getItem('rl_sheet_cache_v2'); if(c){ this.eng.setDATA(this.loader.shape(JSON.parse(c))); this.dataSrc='cache'; return 'cache'; } }catch(_){}
      this.dataSrc = 'bundled'; return 'bundled';
    }
  }
  clearCache(){ let n=0; try{ if(localStorage.getItem('rl_sheet_cache_v2')!=null){ localStorage.removeItem('rl_sheet_cache_v2'); n++; } }catch(_){}
    this.flash(n?this.t('data_cache_cleared'):this.t('data_no_cache')); this.forceUpdate(); }
  async reloadSheet(){
    this.flash(this.t('data_sheet_loading'));
    const src = await this.loadData();
    const sv = this.readSave();
    if(sv) this.applySave(sv); else this.newRun(true);
    this.combat=null; this.go('safehouse');
    this.flash(src==='live'?(this.en()?'Sheet applied — character kept':'시트 반영 완료 — 캐릭터 유지'):src==='cache'?this.t('data_conn_fail_cache'):this.t('data_use_bundle'));
  }
  componentWillUnmount(){ if(this._t) clearInterval(this._t); if(this._ut) clearInterval(this._ut); }
  // ---------- save system (localStorage rl_save_v1 · 안전가옥 기준점만 저장) ----------
  saveObj(){ return { v:1, savedAt:Date.now(), uidCounter:this.eng.getUidCounter(), gs:this.gs }; }
  inSortie(){ return !!this.combat; }
  saveGame(){
    if(!this.gs || !this.eng || this.inSortie()) return;
    clearTimeout(this._saveT);
    this._saveT=setTimeout(()=>{ if(this.inSortie()) return; try{ localStorage.setItem('rl_save_v1', JSON.stringify(this.saveObj())); }catch(_){ } },400);
  }
  validSave(o){ return !!(o && o.v===1 && o.gs && Array.isArray(o.gs.bag) && Array.isArray(o.gs.vault)); }
  readSave(){ try{ const s=localStorage.getItem('rl_save_v1'); if(!s) return null; const o=JSON.parse(s); return this.validSave(o)?o:null; }catch(_){ return null; } }
  applySave(o){
    const eng=this.eng, gs=o.gs;
    // 방어: 현재 시트에 없는 id 인스턴스 제거 → 빈 장착 슬롯 null
    const known=(inst)=> !!(inst && inst.id && (eng.anyItem(inst.id) || (eng.byId.liquor&&eng.byId.liquor[inst.id]) || (eng.byId.module&&eng.byId.module[inst.id]) || (eng.byId.usb&&eng.byId.usb[inst.id])));
    gs.bag=(gs.bag||[]).filter(known); gs.vault=(gs.vault||[]).filter(known);
    // 정합: 스테일 데이터로 잘못 생성된 인스턴스 복구 — id가 실제 장비인데 필드가 비면 온전히 재생성(uid·qty 보존)
    const rebuild=(inst)=>{ if(!inst) return inst;
      const rk = eng.byId.weapon[inst.id]?'weapon':eng.byId.armor[inst.id]?'armor':eng.byId.artifact[inst.id]?'artifact':null;
      if(rk && (inst.kind!==rk || inst.maxDur==null || !inst.rolls)){ const fresh=eng.mkInstance(inst.id, inst.qty||1, {}); fresh.uid=inst.uid; return fresh; }
      return inst; };
    gs.bag=gs.bag.map(rebuild); gs.vault=gs.vault.map(rebuild);
    gs.equip=Object.assign({weapon:null,head:null,body:null,artifact1:null,artifact2:null}, gs.equip||{});
    const uids=new Set(gs.bag.concat(gs.vault).map(x=>x.uid));
    ['weapon','head','body','artifact1','artifact2'].forEach(s=>{ if(gs.equip[s]&&!uids.has(gs.equip[s])) gs.equip[s]=null; });
    gs.shopStock=gs.shopStock||{}; gs.sato=eng.N(gs.sato,0); gs.sorties=eng.N(gs.sorties,0);
    this.gs=gs; this.combat=null;
    eng.setUidCounter(o.uidCounter);
    this.staMax=10;
    const full=eng.playerProfile(gs,false);
    gs.maxHp=full.maxHp;
    gs.hp=Math.max(0,Math.min(eng.N(gs.hp,full.maxHp),full.maxHp));
    gs.sta=Math.max(0,Math.min(eng.N(gs.sta,this.staMax),this.staMax));
  }
  exportSaveCode(){
    try{ const code=btoa(unescape(encodeURIComponent(JSON.stringify(this.saveObj()))));
      this.setState({svCode:code});
      try{ if(navigator.clipboard) navigator.clipboard.writeText(code); }catch(_){ }
      this.flash(this.t('save_code_copied'));
    }catch(_){ this.flash(this.t('save_code_invalid')); }
  }
  importSaveCode(code){
    try{
      const o=JSON.parse(decodeURIComponent(escape(atob(String(code||'').replace(/\s+/g,'')))));
      if(!this.validSave(o)){ this.flash(this.t('save_code_invalid')); return; }
      this.applySave(o);
      try{ localStorage.setItem('rl_save_v1', JSON.stringify(this.saveObj())); }catch(_){ }
      this.setState({svImportOpen:false,svImportVal:'',svCode:null,resumeBanner:false});
      this.go('safehouse');
      this.flash(this.t('save_imported'));
    }catch(_){ this.flash(this.t('save_code_invalid')); }
  }
  resetSave(){
    try{ localStorage.removeItem('rl_save_v1'); }catch(_){ }
    this.newRun(true); this.combat=null; this.setState({resumeBanner:false,svCode:null,svImportOpen:false}); this.go('safehouse');
    this.flash(this.t('save_reset_done'));
  }
  componentDidUpdate(){ if(this.logRef){ this.logRef.scrollTop = this.logRef.scrollHeight; } }

  newRun(fresh){
    const gs = this.eng.startingState();
    const full = this.eng.playerProfile(gs,false);
    this.staMax = 10;
    gs.maxHp = full.maxHp; gs.hp = full.maxHp; gs.sta = this.staMax;
    this.gs = gs; this.combat = null;
    // equipped gear is 'carried' — it lives in 소지품(bag), never in 금고(vault)
    ['weapon','head','body'].forEach(s=>{ if(gs.equip[s]) this.moveToBag(gs.equip[s]); });
  }
  moveToBag(uid){ const i=this.gs.vault.findIndex(x=>x.uid===uid); if(i>=0){ const [it]=this.gs.vault.splice(i,1); this.gs.bag.push(it); } }
  rest(){ const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=full.maxHp; this.gs.sta=this.staMax; this.saveGame(); }
  go(screen){ if(this._t){clearInterval(this._t); this._t=null;} if(this._ut){clearInterval(this._ut); this._ut=null;} this._lastScroll=0; this._titleLock=false; clearTimeout(this._titleLockT); this.setState({ screen, modalZone:null, sel:null, titleHidden:false }); if(screen==='safehouse') this.saveGame(); }
  flash(msg){ this.setState({toast:msg}); clearTimeout(this._ft); this._ft=setTimeout(()=>this.setState({toast:null}),2000); this.saveGame(); }

  // ---------- sortie / combat ----------
  zonePool(zoneId){
    const direct=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').map(s=>s.trim()).includes(zoneId));
    if(direct.length) return direct;
    // no explicit pool (e.g. hidden zone) -> auto-populate from the same city's monsters
    const z=this.eng.byId.zone[zoneId];
    if(z){ const pool=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').some(s=>{ const zz=this.eng.byId.zone[s.trim()]; return zz&&zz.CityID===z.CityID; })); if(pool.length) return pool; }
    return this.eng.DATA.monsters;
  }
  hasItem(id){ return this.gs.vault.some(x=>x.id===id)||this.gs.bag.some(x=>x.id===id); }
  consumeItem(id){ const dec=(arr)=>{ const i=arr.findIndex(x=>x.id===id); if(i<0) return false; if(arr[i].qty>1) arr[i].qty--; else arr.splice(i,1); return true; }; return dec(this.gs.bag)||dec(this.gs.vault); }
  startSortie(zoneId){
    const z=this.eng.byId.zone[zoneId];
    if(z && this.eng.N(z.IsHidden)===1 && z.UnlockType==='item' && z.UnlockKey){ this.consumeItem(z.UnlockKey); this.flash(this.t('zone_keycard_used')); }
    this.combat = { zoneId, encounter:0, runLoot:[], runLootInsts:[], satoGained:0 };
    // 귀환 화면 성장 그래프용 — 출정 시작 시점 스냅샷
    this.combat.gSnap = Object.fromEntries(['str','dex','vit','will'].map(k=>[k,{ level:this.gs.growth[k].level, pct:this.eng.growthPct(this.gs,k) }]));
    this.setState({ screen:'combat', modalZone:null });
    this.drawCards();

        const mrow=this.eng.byId.monster[c.mProf.id]||{}, isBoss=String(mrow.Grade||'').toUpperCase()==='BOSS';
        const lo=this.eng.N(isBoss?cfg.sato_drop_boss_mult_min:cfg.sato_drop_stamina_mult_min, isBoss?1:0.6);
        const hi=this.eng.N(isBoss?cfg.sato_drop_boss_mult_max:cfg.sato_drop_stamina_mult_max, isBoss?5:1.1);

  stackAdd(arr, id, qty, opts){

  // ================= v3 shared: sockets · 미감정 배지 =================
  moduleColor(id){ const m=this.eng.byId.module[id]; return m?m.HexCode:T.line2; }
  socketRow(inst, opt){ opt=opt||{}; const sz=opt.size||18; if(!inst||!inst.sockets||!inst.sockets.length) return null;
    return h('div',{style:{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}, ...inst.sockets.map((s,i)=>{
      const filled=!!s; const col=filled?this.moduleColor(s.moduleId):null;
      return h('div',{key:i,onClick:opt.onPick?()=>opt.onPick(i):null,title:filled?this.eng.tr(this.eng.byId.module[s.moduleId],'ColorName'):'',
        style:{width:sz,height:sz,borderRadius:'50%',border:'1.5px solid '+(filled?col:T.line2),background:filled?col:'transparent',cursor:opt.onPick?'pointer':'default',boxShadow:filled?'0 0 6px '+col:'none',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:T.mono,fontSize:sz*0.5,color:T.faint,boxSizing:'border-box',flex:'0 0 auto'}},
        ''); })); }
  unappBadge(sz){ return h('span',{style:{display:'inline-flex',alignItems:'center',gap:3,fontFamily:T.mono,fontSize:sz||9.5,fontWeight:500,letterSpacing:'.05em',color:T.warn,border:'1px solid '+T.warn,borderRadius:2,padding:'1px 5px',whiteSpace:'nowrap'}}, '◇ '+this.t('appraise_unappraised')); }
  ownedBy(pred){ return [...this.gs.bag,...this.gs.vault].filter(pred); }
  ownedLiquor(){ return this.ownedBy(x=>this.eng.byId.liquor&&this.eng.byId.liquor[x.id]); }
  ownedModules(kind){ return this.ownedBy(x=>{ const m=this.eng.byId.module&&this.eng.byId.module[x.id]; return m&&String(m.Tag)===kind; }); }
  unappItems(){ return this.ownedBy(x=>(x.kind==='weapon'||x.kind==='armor')&&x.unappraised&&x.unappraised.length>0); }
  socketItems(){ const eq=['weapon','head','body'].map(s=>this.gs.equip[s]).filter(Boolean).map(u=>this.eng.instById(this.gs,u)).filter(Boolean);
    const inv=this.ownedBy(x=>(x.kind==='weapon'||x.kind==='armor')&&x.sockets&&x.sockets.length>0);
    const seen=new Set(); return [...eq,...inv].filter(x=>x&&x.sockets&&x.sockets.length>0&&!seen.has(x.uid)&&seen.add(x.uid)); }
  consumeInst(uid){ const dec=(arr)=>{ const i=arr.findIndex(x=>x.uid===uid); if(i<0)return false; if((arr[i].qty||1)>1)arr[i].qty--; else arr.splice(i,1); return true; }; return dec(this.gs.bag)||dec(this.gs.vault); }

  // ================= 감정 (마르타 콜 · 전당포) =================
  aprDialogue(line){ return h('div',{style:{background:T.s1,border:'1px solid '+T.line,borderRadius:6,padding:'13px 15px',marginBottom:16}},

    h('div',{style:{fontFamily:T.sans,fontSize:14,color:T.hi,lineHeight:1.65,wordBreak:'keep-all'}}, '"'+line+'"')); }
  runAppraise(){ const a=this.state.apr; const liq=this.eng.instById(this.gs,a.liquorUid), item=this.eng.instById(this.gs,a.itemUid); if(!liq||!item) return;
    const cost=this.eng.N(this.eng.DATA.config.appraise_cost,0);
    if(this.gs.sato<cost){ this.flash(this.t('shop_insufficient_sato')); return; }
    const proof=liq.proof; const changes=this.eng.appraise(item,proof);
    this.gs.sato-=cost; liq.usesLeft=(liq.usesLeft||1)-1; if(liq.usesLeft<=0) this.consumeInst(liq.uid);
    const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=Math.min(this.gs.hp,this.gs.maxHp);
    this.setState({apr:{...a,results:changes,proof}}); }
  aprValFmt(k,v){ if(k==='growthTags') return ''; if(['accuracy','critChance','evasion','statusResist','atkSpeed','minAtk','maxAtk','def','maxDur','potency'].includes(k)) return Number(v).toFixed(2); return Number(v).toFixed(2); }

    const ghost=(t,onClick)=>h('button',{onClick,style:{width:'100%',background:'transparent',border:'1px solid '+T.line2,color:T.mid,fontFamily:T.sans,fontSize:14,fontWeight:400,padding:'11px',borderRadius:4,cursor:'pointer',marginTop:8}}, t);

        : [h('div',{key:'e',style:{fontFamily:T.sans,fontSize:13,color:T.faint,padding:'18px 0',textAlign:'center'}}, this.t('appraise_no_liquor'))])];

        card(false,()=>this.setState({apr:{...a,itemUid:inst.uid}}), h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}},
          h('div',null, h('div',{style:{fontFamily:T.sans,fontSize:14,fontWeight:500,color:T.hi}}, this.itemLabel(inst)),

          this.unappBadge())))
        : [h('div',{key:'e',style:{fontFamily:T.sans,fontSize:13,color:T.faint,padding:'18px 0',textAlign:'center'}}, this.t('appraise_no_item'))]),
        ghost(this.t('btn_back'),()=>this.setState({apr:{}}))];
    } else if(step==='confirm'){ line=this.t('marta_confirm'); const liq=this.eng.instById(this.gs,a.liquorUid), item=this.eng.instById(this.gs,a.itemUid);

  // ================= 모듈 (미스터 박 · 소켓) =================
  attachModuleNow(){ const m=this.state.mod; const item=this.eng.instById(this.gs,m.itemUid); const cost=this.eng.N(this.eng.DATA.config.module_attach_cost,500);
    if(this.gs.sato<cost){ this.flash(this.t('shop_insufficient_sato')); return; }
    if(!this.eng.attachModule(item,m.socketIdx,m.moduleId)){ this.flash(this.t('module_attach_fail')); return; }
    this.gs.sato-=cost; this.consumeInst(this.moduleInvUid(m.moduleId));
    const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
    this.setState({mod:{itemUid:m.itemUid}}); }
  removeModuleNow(){ const m=this.state.mod; const item=this.eng.instById(this.gs,m.itemUid); const cost=this.eng.N(this.eng.DATA.config.module_remove_cost,300);
    if(this.gs.sato<cost){ this.flash(this.t('shop_insufficient_sato')); return; }
    this.eng.removeModule(item,m.socketIdx); this.gs.sato-=cost;
    const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
    this.setState({mod:{itemUid:m.itemUid}}); }
  moduleInvUid(moduleId){ const inst=this.ownedBy(x=>x.id===moduleId)[0]; return inst?inst.uid:null; }

  // 게이지 차오름 애니메이션: fill width + 숫자 카운트업 + 샤이머/리딩엣지(rcv-on) + 완료 펄스(rcv-done)
  animRecover(fillEl,numEl,barEl,startVal,endVal,maxVal){
    return new Promise(resolve=>{
      if(!fillEl){ resolve(); return; }
      const startPct=maxVal>0?Math.max(0,Math.min(100,startVal/maxVal*100)):0;
      const endPct=maxVal>0?Math.max(0,Math.min(100,endVal/maxVal*100)):0;   // 수리는 부분 회복(≠100%)도 가능
      if(barEl) barEl.classList.add('rcv-on');
      const dur=1100, ease=t=>1-Math.pow(1-t,3); let st=null;
      const tick=now=>{
        if(st==null)st=now;
        const t=Math.min(1,(now-st)/dur), f=ease(t);
        fillEl.style.width=(startPct+(endPct-startPct)*f)+'%';
        if(numEl) numEl.textContent=Math.round(startVal+(endVal-startVal)*f)+' / '+Math.round(maxVal);
        if(t<1) requestAnimationFrame(tick);
        else{
          fillEl.style.width=endPct+'%';
          if(numEl) numEl.textContent=Math.round(endVal)+' / '+Math.round(maxVal);
          if(barEl){ barEl.classList.remove('rcv-on'); barEl.classList.add('rcv-done'); setTimeout(()=>{ if(barEl) barEl.classList.remove('rcv-done'); },520); }
          resolve();
        }
      };
      requestAnimationFrame(tick);
    });
  }
