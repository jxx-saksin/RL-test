class Component extends DCLogic {
  state = { ready:false, splash:true, screen:'safehouse', modalZone:null, sel:null, seg:'bag', filter:'전체', toast:null, repairSel:null, moveQty:null, vendor:null, vtab:'buy', combatSheet:null, buySel:null, buyQty:1, sellSel:null, sellQty:1 };   // splash:true 필수 — 첫 렌더가 loading()으로 새면 fillRef 가드(_bootLoadStarted)가 소비돼 게이지가 0%에 고정된다
  async componentDidMount(){
    try{
      const eng = await import('./engine.js?v=val2');
      const loader = await import('./sheet-loader.js?v=val2');
      this.eng = eng; this.loader = loader; this.dataSrc = 'bundled';
      let savedLang='kr'; try{ savedLang=localStorage.getItem('rl_lang')||'kr'; }catch(_){}
      eng.setLang(savedLang); this.lang=savedLang;
      window.addEventListener('pointerdown', ()=>this.hideToast(), true);  // 토스트: 아무 데나 터치 → 즉시 소멸
      this._dataPromise = this.loadData().catch(()=>{}); // 데이터는 스플래시 대기 중 백그라운드 로드
      this.setState({ ready:false, splash:true });        // "탭하여 시작" 스플래시
    }catch(e){ console.error('engine load failed', e); this.setState({ ready:true, err:String(e) }); }
  }
  // 스플래시 탭 → iOS 자이로 권한 요청(제스처) + 부팅 로딩 진입(게이지 4초 + 로드 완료 대기)
  async _startBoot(){
    if(this._bootStarted) return; this._bootStarted=true;
    await this.requestGyroPerm();   // 권한 팝업 응답까지 대기 → 게이지·타이머가 팝업 닫힌 후 동시에 시작(0% 멈춤 방지)
    this._bootLoadStarted=false;    // 이중 안전 — 어떤 경로로든 가드가 미리 소비됐어도 진짜 로딩에서 게이지 재시작
    this.setState({ splash:false });
    const t0=performance.now();
    // 부팅 배경·전경이 먼저 잡히도록 조금 늦춰 프리로드 시작(같은 순간에 붙으면 부팅 아트가 밀린다)
    setTimeout(()=>this.preloadArt(), 600);
    try{ await this._dataPromise; }catch(_){}
    const rest=4000-(performance.now()-t0); if(rest>0) await new Promise(r=>setTimeout(r,rest));
    // 4초를 다 썼는데도 안전가옥 아트가 안 왔으면 최대 3초까지 더 기다린다(게이지는 99%에서 대기).
    await this.preloadWait(3000);
    this._bootReady=true;
    const sv=this.readSave();
    const notice=this.noticePending();
    if(sv){ this.applySave(sv); this.setState({ ready:true, resumeBanner:true, notice }); }
    else { this.newRun(true); this.setState({ ready:true, notice }); }
    this.stopGyro();
    this.bootFromQuery();
  }
  bootFromQuery(){
    let q; try{ q=new URLSearchParams(location.search); }catch(_){ return; }
    const screen=q.get('screen'); if(!screen) return;
    if(screen==='vendor'){ const id=q.get('vendor')||'vendor_clinic'; const vtab=q.get('vtab'); this.openVendor(id); if(vtab) this.setState({vtab}); }
    // 전리품 화면은 state.lm이 있어야 그려진다 — 샘플 카드를 채워주는 개발용 진입로(?screen=lootmanage)
    else if(screen==='lootmanage'){ this.openLootDebug(); }
    else this.go(screen);
  }
  async loadData(){
    try{
      const rows = await this.loader.fetchAllTabs();
      this.eng.setDATA(this.loader.shape(rows));
      try{ localStorage.setItem('rl_sheet_cache_v2', JSON.stringify(rows)); }catch(_){}
      this.dataSrc = 'live'; return 'live';
    }catch(e){
      console.warn('live sheet fetch failed, falling back', e);
      try{ const c = localStorage.getItem('rl_sheet_cache_v2'); if(c){ this.eng.setDATA(this.loader.shape(JSON.parse(c))); this.dataSrc='cache'; return 'cache'; } }catch(_){}
      this.dataSrc = 'bundled'; return 'bundled';
    }
  }
  clearCache(){ let n=0; try{ if(localStorage.getItem('rl_sheet_cache_v2')!=null){ localStorage.removeItem('rl_sheet_cache_v2'); n++; } }catch(_){}
    this.flash(n?this.t('data_cache_cleared'):this.t('data_no_cache')); this.forceUpdate(); }
  async reloadSheet(){
    this.flash(this.t('data_sheet_loading'));
    const src = await this.loadData();
    const sv = this.readSave();
    if(sv) this.applySave(sv); else this.newRun(true);
    this.combat=null; this.go('safehouse');
    this.flash(src==='live'?(this.en()?'Sheet applied — character kept':'시트 반영 완료 — 캐릭터 유지'):src==='cache'?this.t('data_conn_fail_cache'):this.t('data_use_bundle'));
  }
  componentWillUnmount(){ if(this._t) clearInterval(this._t); if(this._ut) clearInterval(this._ut); }
  // ---------- save system (localStorage rl_save_v1 · 안전가옥 기준점만 저장) ----------
  saveObj(){ return { v:1, savedAt:Date.now(), uidCounter:this.eng.getUidCounter(), gs:this.gs }; }
  inSortie(){ return !!this.combat; }
  saveGame(){
    if(!this.gs || !this.eng || this.inSortie()) return;
    clearTimeout(this._saveT);
    this._saveT=setTimeout(()=>{ if(this.inSortie()) return; try{ localStorage.setItem('rl_save_v1', JSON.stringify(this.saveObj())); }catch(_){ } },400);
  }
  // 출정 진입 비용(키카드 소모 등)을 확정하는 즉시 저장 — inSortie 가드를 1회 우회한다.
  // 이걸 안 하면 진입 직후 앱을 껐다 켰을 때 비용이 되돌아와 '존 재굴리기'가 공짜가 된다.
  // 전투/전리품은 여전히 저장하지 않으므로 중단된 출정은 무효라는 기존 규칙은 그대로.
  saveNow(){
    if(!this.gs || !this.eng) return;
    clearTimeout(this._saveT);
    try{ localStorage.setItem('rl_save_v1', JSON.stringify(this.saveObj())); }catch(_){ }
  }
  validSave(o){ return !!(o && o.v===1 && o.gs && Array.isArray(o.gs.bag) && Array.isArray(o.gs.vault)); }
  readSave(){ try{ const s=localStorage.getItem('rl_save_v1'); if(!s) return null; const o=JSON.parse(s); return this.validSave(o)?o:null; }catch(_){ return null; } }
  applySave(o){
    const eng=this.eng, gs=o.gs;
    // 방어: 현재 시트에 없는 id 인스턴스 제거 → 빈 장착 슬롯 null
    const known=(inst)=> !!(inst && inst.id && (eng.anyItem(inst.id) || (eng.byId.liquor&&eng.byId.liquor[inst.id]) || (eng.byId.module&&eng.byId.module[inst.id]) || (eng.byId.usb&&eng.byId.usb[inst.id])));
    gs.bag=(gs.bag||[]).filter(known); gs.vault=(gs.vault||[]).filter(known);
    // 정합: 스테일 데이터로 잘못 생성된 인스턴스 복구 — id가 실제 장비인데 필드가 비면 온전히 재생성(uid·qty 보존)
    const rebuild=(inst)=>{ if(!inst) return inst;
      const rk = eng.byId.weapon[inst.id]?'weapon':eng.byId.armor[inst.id]?'armor':eng.byId.artifact[inst.id]?'artifact':null;
      if(rk && (inst.kind!==rk || inst.maxDur==null || !inst.rolls)){ const fresh=eng.mkInstance(inst.id, inst.qty||1, {}); fresh.uid=inst.uid; return fresh; }
      return inst; };
    gs.bag=gs.bag.map(rebuild); gs.vault=gs.vault.map(rebuild);
    gs.equip=Object.assign({weapon:null,head:null,body:null,artifact1:null,artifact2:null,bag:null}, gs.equip||{});
    // loc 정규화(자가치유): 가방 용량 기준 재배치. 가방 미착용이면 배낭칸 0 → 주머니 2칸, 초과분은 금고로.
    // (옛 세이브의 loc 없는 아이템, 또는 가방 없는데 배낭에 남은 아이템 정리)
    { const cap=eng.equippedBagCapacity?eng.equippedBagCapacity(gs):0;
      const eqSet=new Set(['weapon','head','body','artifact1','artifact2','bag'].map(s=>gs.equip[s]).filter(Boolean));
      const equippedItems=[], pocket=[], bag=[], toVault=[];
      gs.bag.forEach(x=>{ if(eqSet.has(x.uid)){ equippedItems.push(x); return; }
        if(x.loc==='pocket'){ if(pocket.length<2) pocket.push(x); else if(bag.length<cap){ x.loc='bag'; bag.push(x); } else toVault.push(x); }
        else { if(bag.length<cap){ x.loc='bag'; bag.push(x); } else if(pocket.length<2){ x.loc='pocket'; pocket.push(x); } else toVault.push(x); } });
      gs.bag=[...equippedItems, ...pocket, ...bag];
      toVault.forEach(x=>{ delete x.loc; gs.vault.push(x); }); }
    const uids=new Set(gs.bag.concat(gs.vault).map(x=>x.uid));
    ['weapon','head','body','artifact1','artifact2','bag'].forEach(s=>{ if(gs.equip[s]&&!uids.has(gs.equip[s])) gs.equip[s]=null; });
    gs.shopStock=gs.shopStock||{}; gs.sato=eng.N(gs.sato,0); gs.sorties=eng.N(gs.sorties,0);
    this.gs=gs; this.combat=null;
    this.loadPass();   // 패스는 별도 키가 정본(런 세이브 값보다 우선)
    eng.setUidCounter(o.uidCounter);
    this.staMax=10;
    const full=eng.playerProfile(gs,false);
    gs.maxHp=full.maxHp;
    gs.hp=Math.max(0,Math.min(eng.N(gs.hp,full.maxHp),full.maxHp));
    gs.sta=Math.max(0,Math.min(eng.N(gs.sta,this.staMax),this.staMax));
  }
  exportSaveCode(){
    try{ const code=btoa(unescape(encodeURIComponent(JSON.stringify(this.saveObj()))));
      this.setState({svCode:code});

  componentDidUpdate(){ if(this.logRef){ this.logRef.scrollTop = this.logRef.scrollHeight; } }

  newRun(fresh){
    const gs = this.eng.startingState();
    const full = this.eng.playerProfile(gs,false);
    this.staMax = 10;
    gs.maxHp = full.maxHp; gs.hp = full.maxHp; gs.sta = this.staMax;
    this.gs = gs; this.combat = null;
    this.loadPass();   // 패스는 런과 무관한 고정 자산 — 기존 보유분이 있으면 그대로 이어받는다
    // equipped gear is 'carried' — it lives in 소지품(bag), never in 금고(vault)
    ['weapon','head','body','bag'].forEach(s=>{ if(gs.equip[s]) this.moveToBag(gs.equip[s]); });
  }
  moveToBag(uid){ const i=this.gs.vault.findIndex(x=>x.uid===uid); if(i>=0){ const [it]=this.gs.vault.splice(i,1); this.gs.bag.push(it); } }
  rest(){ const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=full.maxHp; this.gs.sta=this.staMax; this.saveGame(); }
  go(screen){ if(this._t){clearInterval(this._t); this._t=null;} if(this._ut){clearInterval(this._ut); this._ut=null;} this._lastScroll=0; this._titleLock=false; clearTimeout(this._titleLockT); if(screen==='settings') this.requestGyroPerm(); this.setState({ screen, modalZone:null, sel:null, titleHidden:false }); if(screen==='safehouse') this.saveGame(); }
  // 위치는 flash 시점(DOM이 안정된 상태)에 재둔다 — 렌더 중에 재면 시트가 아직 높이 0이라 빗나간다.
  flash(msg){ this._toastAnc=this.toastAnchor(); clearTimeout(this._ft); clearTimeout(this._ftOut);
    this.setState({toast:msg,toastOut:false});
    this._ft=setTimeout(()=>this.setState({toastOut:true}),1000);          // 1초 유지 후
    this._ftOut=setTimeout(()=>this.setState({toast:null,toastOut:false}),1500);  // 0.5초 페이드 아웃
    this.saveGame(); }
  // 화면 아무 데나 터치하면 즉시 사라진다 (componentDidMount에서 캡처 단계로 연결)
  hideToast(){ if(!this.state.toast) return; clearTimeout(this._ft); clearTimeout(this._ftOut); this.setState({toast:null,toastOut:false}); }

  // ---------- sortie / combat ----------
  zonePool(zoneId){
    const direct=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').map(s=>s.trim()).includes(zoneId));
    if(direct.length) return direct;
    // no explicit pool (e.g. hidden zone) -> auto-populate from the same city's monsters
    const z=this.eng.byId.zone[zoneId];
    if(z){ const pool=this.eng.DATA.monsters.filter(m=>String(m.SpawnZones||'').split(',').some(s=>{ const zz=this.eng.byId.zone[s.trim()]; return zz&&zz.CityID===z.CityID; })); if(pool.length) return pool; }
    return this.eng.DATA.monsters;
  }
  hasItem(id){ return this.gs.vault.some(x=>x.id===id)||this.gs.bag.some(x=>x.id===id); }
  itemQty(id){ const n=(a)=>a.reduce((s,x)=>s+(x.id===id?(x.qty||1):0),0); return n(this.gs.bag)+n(this.gs.vault); }
  consumeItem(id){ const dec=(arr)=>{ const i=arr.findIndex(x=>x.id===id); if(i<0) return false; if(arr[i].qty>1) arr[i].qty--; else arr.splice(i,1); return true; }; return dec(this.gs.bag)||dec(this.gs.vault); }
  // 패스 차감은 태그 화면의 카드 삽입 시점(tapInsert)에서 이미 끝난 상태로 들어온다.
  startSortie(zoneId){
    const z=this.eng.byId.zone[zoneId];
    if(z && this.eng.N(z.IsHidden)===1 && z.UnlockType==='item' && z.UnlockKey){ this.consumeItem(z.UnlockKey); this.flash(this.t('zone_keycard_used')); }
    this.saveNow();   // 진입 비용(키카드 소모) 확정 — combat 세팅 전이라 inSortie 가드와 무관
    this.combat = { zoneId, encounter:0, runLoot:[], runLootInsts:[], satoGained:0 };
    // 귀환 화면 성장 그래프용 — 출정 시작 시점 스냅샷
    this.combat.gSnap = Object.fromEntries(['str','dex','vit','will'].map(k=>[k,{ level:this.gs.growth[k].level, pct:this.eng.growthPct(this.gs,k) }]));
    // 출정 로딩 화면(강제 2.5초) → beginSortieCombat에서 실제 카드 드로우
    this._sortieTip=this.pickTip(); this._sortieBg=this.sortieMonsterBg(zoneId); this._sortieLoadStarted=false;
    this.setState({ screen:'sortieLoad', sortieZone:zoneId, modalZone:null });
  }
  beginSortieCombat(){
    this._sortieLoadStarted=false;
    this.stopGyro(); // 출정 패럴랙스 자이로 리스너 해제
    this.setState({ screen:'combat' });
    this.drawCards();
    const over=[]; if(this.bagMedicineQty()>this.medicineMax()) over.push(this.en()?'medicine':'의약품'); if(this.bagFoodQty()>this.foodMax()) over.push(this.en()?'food':'음식');
    if(over.length) setTimeout(()=>this.flash(this.en()?(over.join(' & ')+' over slot limit'):(over.join('·')+' 제한 갯수 초과')),120);
  }
  drawCards(){
    const n = this.eng.N(this.eng.DATA.config.combat_card_count, 3);
    const zone = this.eng.byId.zone[this.combat.zoneId];
    const isPvp = this.isPvpZone(zone);
    const userChance = zone ? this.eng.N(String(zone.UserDataChance==null?'':zone.UserDataChance).replace('%',''))/100 : 0;
    // 조우 카드: PvP 존에서는 각 카드가 UserDataChance(%)로 몬스터/유저(콜드데이터) 확정 (§6-6)
    const cards = this.eng.drawCards(this.combat.zoneId, n, (this.combat.encounter||0)+1).map(id=>{
      if(isPvp && Math.random()<userChance){
        const bot=this.eng.pickColdOpponent(this.gs, zone.CityID);
        if(bot) return { type:'user', bot };
      }
      return { type:'monster', id };
    });
    Object.assign(this.combat, { cards, picked:null, mProf:null, pvp:null, pvpCards:null, phase:'cards', res:null, revealed:0, loot:[], ups:[], cardFocus:Math.floor(n/2), flipped:false });
    if(this._t){ clearInterval(this._t); this._t=null; }
    this.forceUpdate();
  }
  pickCard(i){
    const card=this.combat.cards[i]; if(!card) return;
    if(card.type==='user'){ Object.assign(this.combat, { picked:i, pvp:card.bot, mProf:this.eng.coldProfile(card.bot), phase:'preview' }); }
    else { const m=this.eng.byId.monster[card.id]; if(!m) return; Object.assign(this.combat, { picked:i, pvp:null, mProf:this.eng.monsterProfile(m), phase:'preview' }); }
    this.forceUpdate();
  }
  enterCombat(){
    if(typeof navigator!=='undefined' && navigator.vibrate){ try{ navigator.vibrate(40); }catch(e){} } // 제스처 결합 진동(활성화 확보 + 전투 시작 피드백)
    const mProf = this.combat.mProf;
    // 탈진 판정 = 진입 시점 스태미너 0(이전 전투 누적). 이번 전투 소모는 종료 후(finishCombat)로 이동 —
    // 그래야 7스태미너로 보스(8소모) 돌입해도 이번 전투는 정상, 다음 전투부터 탈진.
    const staZero = this.gs.sta <= 0;
    const full = this.eng.playerProfile(this.gs,false);
    const prof = this.eng.playerProfile(this.gs, staZero); prof.maxHp = full.maxHp;
    const res = this.eng.simulateCombat(prof, mProf, this.gs.hp);
    Object.assign(this.combat, { prof:prof, res, revealed:1, phase:'fighting', staZero, encounter:this.combat.encounter+1 });
    this.forceUpdate();
    if(this._t) clearInterval(this._t);
    this._t = setInterval(()=>this.tick(), 300);
  }
  tick(){
    const c=this.combat;
    if(c.revealed < c.res.log.length){ c.revealed++; this.setCombatFx(c); this.forceUpdate(); }
    else { clearInterval(this._t); this._t=null; this.finishCombat(); }
  }
  setCombatFx(c){
    const idx=c.revealed-1, ln=c.res.log[idx];
    if(!ln || (ln.type!=='hit' && ln.type!=='crit' && ln.type!=='miss')){ c.fx=null; return; }
    const target = ln.who==='player' ? 'monster' : 'player';   // 공격자 반대편이 피격
    let dmg=0;
    if(ln.type==='hit' || ln.type==='crit'){
      const f = target==='monster' ? 'hpM' : 'hpP', prev=c.res.log[idx-1];
      const before = prev ? prev[f] : (target==='monster' ? c.mProf.maxHp : c.prof.maxHp);
      dmg = Math.max(0, Math.round(before - ln[f]));
    }
    c.fxSeq=(c.fxSeq||0)+1;
    c.fx={ seq:c.fxSeq, type:ln.type, target, dmg, crit:ln.type==='crit', rx:0.18+Math.random()*0.64, ry:0.06+Math.random()*0.14 };
    if(typeof navigator!=='undefined' && navigator.vibrate){ try{ if(ln.type==='crit') navigator.vibrate([0,80,45,90]); else if(ln.type==='hit') navigator.vibrate(50); }catch(e){} }
  }
  finishCombat(){
    const c=this.combat, res=c.res;
    this.gs.hp = res.playerHpEnd;
    // 전투 종료 후 몬스터 등급만큼 스태미너 소모(진입 전이 아니라 종료 후). 도주 성공은 여기 안 옴 = 소모 없음.
    this.gs.sta = Math.max(0, this.gs.sta - this.eng.N(c.mProf.staminaCost, 0));
    c.durChanges = this.eng.applyDurabilityWear(this.gs, res.triggers) || [];
    // ---- PvP(콜드데이터) 승패는 카드 트랙으로만 처리 (§6-6, death_durability_loss 미적용) ----
    if(c.pvp){
      if(res.winner==='player'){
        c.ups = this.eng.applyGrowth(this.gs, res.triggers);
        const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
        this.setupPvpReward(); c.phase='pvpWin';
      } else if(res.winner==='monster'){ c.satoGained=0; this.setupPvpFlee(); c.phase='pvpLose'; }  // PvP 패배 = 이번 출정 사토 몰수(사망과 동일)
      else { c.phase='timeout'; }
      this.forceUpdate(); return;
    }
    if(res.winner==='player'){
      const loot = this.eng.rollLoot(c.mProf.id, c.zoneId);
      // quest drop: the police keycard is carried by 하람의 파수꾼 (assigned drop, not a global roll)
      if(c.mProf.id==='monster_haram_warden' && !this.hasItem('item_police_keycard') && Math.random()<0.35){ loot.push({id:'item_police_keycard', qty:1}); }
      c.lootInsts=[]; c.lootDraw=[];
      // 전투 드랍 → 루팅 카드 화면에서 직접 담게 인스턴스 생성. 드랍은 전부 낱개(qty 1)로 분리 — 스택은 가방에 담길 때만.
      for(const l of loot){ c.runLoot.push(l); const n=Math.max(1, l.qty||1);
        for(let k=0;k<n;k++){ const inst=this.eng.mkInstance(l.id, 1, {unappraisedMult:l.unappraisedMult}); inst.qty=1; inst.locked=false; c.lootDraw.push(inst); } }
      c.loot = loot;
      // 사토 드롭 (Config 공식: StaminaCost × per × rand(등급 배율)) — 누적만, 귀환 성공 시 지급(사망 시 0)
      { const cfg=this.eng.DATA.config, per=this.eng.N(cfg.stamina_cost_per_point,20), sc=this.eng.N(c.mProf.staminaCost,1);
        const mrow=this.eng.byId.monster[c.mProf.id]||{}, isBoss=String(mrow.Grade||'').toUpperCase()==='BOSS';
        const lo=this.eng.N(isBoss?cfg.sato_drop_boss_mult_min:cfg.sato_drop_stamina_mult_min, isBoss?1:0.6);
        const hi=this.eng.N(isBoss?cfg.sato_drop_boss_mult_max:cfg.sato_drop_stamina_mult_max, isBoss?5:1.1);
        const gain=Math.max(0, Math.round(sc*per*(lo+Math.random()*(hi-lo))));
        c.satoGained=(c.satoGained||0)+gain; }
      if(loot.length){ c.res.log.push({t:res.elapsed||0, who:'sys', type:'win', text:this.eng.logTpl('loot',{}), hpP:res.playerHpEnd, hpM:0}); c.revealed=c.res.log.length; }
      c.ups = this.eng.applyGrowth(this.gs, res.triggers);
      const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp;
      c.phase='won';
      if(c.lootDraw && c.lootDraw.length){
        // 사전소지품(주머니/가방)을 드랍 화면에 함께 표시 — gs.bag의 미착용 아이템을 lm.bag으로 이동(중복 방지), 커밋 시 되돌림.
        const lm={view:'field',focus:0,fromCombat:true,field:c.lootDraw.slice(),bag:[]}; const keep=[];
        for(const it of this.gs.bag){ if(this.isEquipped(it.uid)){ keep.push(it); continue; } it.locked=(it.loc==='pocket'); it.pre=true; lm.bag.push(it); }
        this.gs.bag=keep; this.state.lm=lm; this.setState({screen:'lootmanage'}); return;
      }
    } else if(res.winner==='monster'){ c.phase='dead'; }
    else { c.phase='timeout'; }
    this.forceUpdate();
  }
  maxStack(id){ const s=this.eng.byId.item[id]; return Math.max(1, this.eng.N(s&&s.MaxStack,1)); }
  // add `qty` of `id` into `arr`, never exceeding MaxStack per stack — overflow spills into new stacks
  stackAdd(arr, id, qty, opts){
    const max=this.maxStack(id); const made=[]; let left=qty;
    if(max>1){ for(const ex of arr){ if(ex.id!==id) continue; const room=max-(ex.qty||1); if(room>0){ const take=Math.min(room,left); ex.qty=(ex.qty||1)+take; left-=take; if(made.indexOf(ex)<0) made.push(ex); } if(left<=0) break; } }
    while(left>0){ const take=max>1?Math.min(max,left):1; const inst=this.eng.mkInstance(id,take,opts||{}); if(max>1) inst.qty=take; arr.push(inst); made.push(inst); left-=take; }
    return made;
  }
  addToBag(id, qty, opts){ return this.stackAdd(this.gs.bag, id, qty, opts); }
  // 획득 아이템을 소지품에 배정: 배낭(착용 가방 용량) 우선 → 없으면 주머니 2칸 → 둘 다 가득이면 금고로.
  // 가방 미착용이면 배낭칸이 0이라 주머니→금고 순. (belongings가 loc 없는 아이템을 배낭으로 몰던 문제 예방)
  placeLootIntoBag(inst){
    const cap=this.eng.equippedBagCapacity?this.eng.equippedBagCapacity(this.gs):0;
    const bagUsed=this.gs.bag.filter(x=>!this.isEquipped(x.uid)&&x.loc!=='pocket').length;
    const pkUsed=this.gs.bag.filter(x=>!this.isEquipped(x.uid)&&x.loc==='pocket').length;
    if(bagUsed<cap){ inst.loc='bag'; this.gs.bag.push(inst); }
    else if(pkUsed<2){ inst.loc='pocket'; this.gs.bag.push(inst); }
    else { delete inst.loc; this.gs.vault.push(inst); }
    return inst;
  }
  extract(){ if(this.combat && !this.combat.satoPaid){ this.gs.sato+=this.eng.N(this.combat.satoGained,0); this.combat.satoPaid=true; } this.setState({ screen:'result' }); this.combat.result='extract'; if(this._t){clearInterval(this._t);this._t=null;} this.forceUpdate();
    if(this.lootUids().length){ this.combat.resultStage='loot'; if(this._lootRevealTimer)clearTimeout(this._lootRevealTimer); this._lootRevealTimer=setTimeout(()=>this.startLootReveal(), 450); } }
  death(){
    this.gs.hp = 1;   // 사망(몬스터·PvP) 귀환 시 체력 1로 생존
    // 사망 시 유지: 주머니 2슬롯 + 착용 장비(투구·갑옷·무기·악세서리·부적). 가방(및 가방 속 전리품)은 착용템이라도 예외로 전부 소멸.
    this.gs.equip.bag = null; // 가방 슬롯 먼저 해제 → 가방 인스턴스가 isEquipped=false가 되어 아래 필터에서 제거됨
    this.gs.bag = this.gs.bag.filter(x=>this.isEquipped(x.uid) || x.loc==='pocket'); // 착용 장비 + 주머니만 생존 (가방·배낭 내용물은 제외됨)
    const eq = [this.gs.equip.weapon,this.gs.equip.head,this.gs.equip.body,this.gs.equip.artifact1,this.gs.equip.artifact2].filter(Boolean);
    let broke=null;
    if(eq.length){ const uid=eq[Math.floor(Math.random()*eq.length)]; const inst=this.eng.instById(this.gs,uid);
      // 사망 시 장비는 this.t('item_current_durability')만 손상된다 — 최대 내구도는 수리 실패로만 영구 감소한다
      if(inst){ inst.dur=Math.max(0,(inst.dur||0)-this.eng.R.randInt(2,5)); broke=inst; } }

  // ---------- inventory ----------
  medicineMax(){ return this.eng.N(this.eng.DATA.config.medicine_slot_default,5); }
  foodMax(){ return this.eng.N(this.eng.DATA.config.food_slot_default,5); }
  isMedicine(inst){ const it=inst&&this.eng.byId.item[inst.id]; return !!(it && String(it.Category)==='Medicine'); }
  isFood(inst){ const it=inst&&this.eng.byId.item[inst.id]; return !!(it && String(it.Category)==='Food'); }
  bagMedicineQty(){ return this.gs.bag.filter(x=>this.isMedicine(x)).reduce((s,x)=>s+(x.qty||1),0); }
  bagFoodQty(){ return this.gs.bag.filter(x=>this.isFood(x)).reduce((s,x)=>s+(x.qty||1),0); }
  medicineRoom(){ return Math.max(0, this.medicineMax()-this.bagMedicineQty()); }
  foodRoom(){ return Math.max(0, this.foodMax()-this.bagFoodQty()); }
  slotRoomFor(inst){ if(this.isMedicine(inst)) return {room:this.medicineRoom(),max:this.medicineMax(),label:this.en()?'Medicine':'의약품'}; if(this.isFood(inst)) return {room:this.foodRoom(),max:this.foodMax(),label:this.en()?'Food':'음식'}; return null; }
  moveItem(uid){
    const inVault0=this.gs.vault.find(x=>x.uid===uid); const cap0=inVault0?this.slotRoomFor(inVault0):null;
    if(cap0){ if(cap0.room<=0){ this.flash(cap0.label+(this.en()?(' slots full ('+cap0.max+')'):(' 소지 한도 '+cap0.max+'개'))); return; } if((inVault0.qty||1)>cap0.room){ this.moveStack(uid, cap0.room); return; } }
    const merge=(dst,inst)=>{ if(this.maxStack(inst.id)>1){ this.stackAdd(dst, inst.id, inst.qty||1, {unappraisedMult:inst.unappraisedMult}); return true; } return false; };
    const inV = this.gs.vault.findIndex(x=>x.uid===uid);
    if(inV>=0){ const it=this.gs.vault[inV];
      // 스택 아이템이고 소지품에 같은 더미가 있으면 거기 병합(새 칸 안 먹음)
      const hasDump=this.maxStack(it.id)>1 && this.gs.bag.some(x=>x.id===it.id && !this.isEquipped(x.uid));
      if(hasDump){ this.gs.vault.splice(inV,1); this.stackAdd(this.gs.bag,it.id,it.qty||1,{unappraisedMult:it.unappraisedMult}); }
      else {
        // 새 칸 필요: 배낭(착용 가방 용량) 우선 → 없으면 주머니 2칸 → 둘 다 가득이면 거부.
        const bagCap=this.eng.equippedBagCapacity?this.eng.equippedBagCapacity(this.gs):0;
        const bagUsed=this.gs.bag.filter(x=>!this.isEquipped(x.uid)&&x.loc!=='pocket').length;
        const pkUsed=this.gs.bag.filter(x=>!this.isEquipped(x.uid)&&x.loc==='pocket').length;
        const loc = bagUsed<bagCap ? 'bag' : (pkUsed<2 ? 'pocket' : null);
        if(!loc){ this.flash(this.en()?'Bag & pocket full':'가방·주머니 가득 참'); return; }
        this.gs.vault.splice(inV,1); it.loc=loc; this.gs.bag.push(it);
      } }
    else { const inB=this.gs.bag.findIndex(x=>x.uid===uid); if(inB>=0){
      // 착용 중인 장비는 금고로 보낼 수 없다 — 옮기면 자동 해제
      if(this.isEquipped(uid)){ const e=this.gs.equip; ['weapon','head','body','artifact1','artifact2'].forEach(s=>{ if(e[s]===uid) e[s]=null; }); const full=this.eng.playerProfile(this.gs,false); this.gs.maxHp=full.maxHp; this.gs.hp=Math.min(this.gs.hp,this.gs.maxHp); }
      const [it]=this.gs.bag.splice(inB,1); if(!merge(this.gs.vault,it)) this.gs.vault.push(it);
    } }
    this.saveGame();
    this.forceUpdate();
  }
  // ---------- move / vendor helpers ----------
  moveStack(uid, n){
    const inVault=this.gs.vault.some(x=>x.uid===uid);
    const src=inVault?this.gs.vault:this.gs.bag, dst=inVault?this.gs.bag:this.gs.vault;
    const i=src.findIndex(x=>x.uid===uid); if(i<0) return;
    const inst=src[i]; const total=inst.qty||1;
    n=Math.max(1,Math.min(n||total,total));
    if(inVault){ const cap=this.slotRoomFor(inst); if(cap){ if(cap.room<=0){ this.flash(cap.label+(this.en()?(' slots full ('+cap.max+')'):(' 소지 한도 '+cap.max+'개'))); return; } n=Math.min(n,cap.room); } }
    if(n>=total){ this.moveItem(uid); return; }
    inst.qty-=n;
    this.stackAdd(dst, inst.id, n, {unappraisedMult:inst.unappraisedMult});
    this.saveGame();
    this.forceUpdate();
  }

  openVendor(id){ const v=this.eng.byId.vendor[id]; const svc=this.services(v); const first=svc.includes('Buy')?'buy':svc.includes('Repair')?'repair':svc.includes('Heal')?'heal':(svc.includes('Feed')||svc.includes('Distribute'))?'feed':svc.includes('Load')?'load':svc.includes('Appraisal')?'appraise':svc.includes('Module')?'module':'sell'; if(this._t){clearInterval(this._t);this._t=null;}
    if(svc.includes('Load')){

  // ---------- shop ----------
  buy(shopId, row, qty){
    qty=Math.max(1, qty||1);
    const price=this.eng.N(row.BuyPrice);
    const key=shopId+'|'+row.ItemID;
    const stock = this.gs.shopStock[key]!=null ? this.gs.shopStock[key] : this.eng.N(row.StockMax,99);
    const total=price*qty;
    if(this.gs.sato < total){ this.flash(this.t('shop_insufficient_sato')); return; }
    if(stock < qty){ this.flash(this.t('shop_out_of_stock')); return; }
    this.gs.sato -= total; this.gs.shopStock[key]=stock-qty; this.addToVault(row.ItemID,qty);
    this.flash(this.t('shop_buy_done')); this.setState({buySel:null,buyQty:1});
  }

  openBuy(shopId,row){
    const price=this.eng.N(row.BuyPrice);

  pickTip(){ const arr=(this.eng&&this.eng.DATA&&this.eng.DATA.tips)||[];

    const f=TIP_FALLBACK[Math.floor(Math.random()*TIP_FALLBACK.length)]; return this.en()?f[1]:f[0]; }
  // 로딩 게이지 0→100 rAF 카운트업 (막대 width + 숫자 직접 갱신, 재렌더 없음). 끝나면 onDone.
  // holdAt: ()=>true 인 동안 99%에서 멈춰 기다린다. 부팅은 시트 로드·1순위 아트 프리로드가
  // 4초를 넘길 수 있어서, 게이지를 100%에 박아두는 대신 아직 끝나지 않았음을 보여준다.
  animLoad(fillEl, numEl, durMs, onDone, holdAt){ const t0=performance.now();
    const tick=(now)=>{ let p=Math.max(0,Math.min(1,(now-t0)/durMs));
      const hold = p>=1 && holdAt && holdAt();
      if(hold) p=0.99;
      const v=Math.round(p*100);
      if(fillEl) fillEl.style.width=v+'%'; if(numEl) numEl.textContent=v;
      if(p<1||hold){ requestAnimationFrame(tick); } else if(onDone){ onDone(); } };
    requestAnimationFrame(tick); }
  // ---- 효과음 ----
  // 같은 소리가 겹칠 수 있어 매번 새 Audio를 쓴다(재생 중 재호출 시 앞소리가 끊기지 않게).
  // 실패는 조용히 삼킨다 — 소리가 안 나는 것보다 예외로 화면이 멈추는 게 나쁘다.
  sfx(name){ const src=SFX[name]; if(!src||this._sfxOff) return;
    try{ const a=new Audio(src); a.volume=0.85; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(_){ } }
  // iOS/안드로이드 자동재생 해제 — 반드시 사용자 제스처 안에서. 무음 1회 재생으로 오디오를 깨운다.
  sfxUnlock(){ if(this._sfxReady) return; this._sfxReady=true;
    // 진짜 효과음이 아니라 무음 파일을 재생한다 — iOS에서 타이틀 탭에 카드소리가 나던 원인(2026-08-17)
    try{ const a=new Audio(SFX_SILENT); const p=a.play();
      if(p&&p.then) p.then(()=>{ a.pause(); a.currentTime=0; }).catch(()=>{});
      // 실제 mp3는 소리 없이 받아만 둔다(첫 재생 끊김 방지)
      Object.values(SFX).forEach(src=>{ try{ const w=new Audio(); w.preload='auto'; w.src=src; }catch(_){ } });
    }catch(_){ } }
  // ---- 아트 프리로드 (PRELOAD) ----
  // 순위별로 순차 실행. 한 순위가 끝나면 유휴 시간에 다음 순위로 넘어가 부팅 아트와 대역폭을 다투지 않게 한다.
  preloadArt(){
    if(this._preStarted) return; this._preStarted=true;
    const one=(src)=>new Promise(res=>{ const im=new Image(); im.onload=im.onerror=()=>res(); im.src=src; });
    const tier=(list)=>Promise.all(list.map(one));
    this._preT1=tier(PRELOAD[0]);
    const idle=window.requestIdleCallback||((f)=>setTimeout(f,200));
    let i=1; const next=()=>{ if(i>=PRELOAD.length) return; const list=PRELOAD[i++]; tier(list).then(()=>idle(next)); };
    this._preT1.then(()=>idle(next));
  }
  // 1순위가 끝날 때까지(최대 maxMs) 기다린다. 느린 회선에서 무한정 붙잡지 않도록 상한을 둔다.
  preloadWait(maxMs){
    if(!this._preT1) return Promise.resolve();
    return Promise.race([this._preT1, new Promise(r=>setTimeout(r,maxMs))]);
  }
  // 자이로 패럴랙스 — 기기 기울임(deviceorientation)으로 배경·독수리를 서로 다르게 이동(rAF lerp로 부드럽게).
  // iOS13+는 권한 필요(자동 화면이라 권한 없으면 이벤트 미수신 → 확대만). 안드로이드는 바로 작동.
  // iOS13+ 자이로 권한 요청 — 반드시 사용자 제스처(설정 진입 탭) 안에서 호출. 한 번 허용하면 세션 유지.
  // 권한 팝업 응답(허용/거부)까지 기다릴 수 있도록 Promise 반환. 팝업이 없는 기기(안드로이드·PC)는 즉시 resolve.
  requestGyroPerm(){
    return new Promise(resolve=>{
      let done=false; const fin=(s)=>{ if(done) return; done=true; resolve(s); };
      const guard=setTimeout(()=>fin('timeout'), 8000); // 팝업 미응답 시 부팅이 멈추지 않도록 안전장치
      try{ const D=window.DeviceOrientationEvent;
        if(D && typeof D.requestPermission==='function'){
          D.requestPermission().then(s=>{ this._gyroGranted=(s==='granted'); clearTimeout(guard); fin(s); }).catch(()=>{ clearTimeout(guard); fin('error'); });
        } else { clearTimeout(guard); fin('n/a'); }
      }catch(_){ clearTimeout(guard); fin('error'); }
    });
  }
  startGyro(){ if(this._gyroRAF) return;
    this._gyroTarget={x:0,y:0}; this._gyroCur={x:0,y:0}; this._gyroGotEvent=false; this._gyroT0=performance.now();
    this._gyroHandler=(e)=>{ const g=e.gamma||0, b=e.beta||0; if(g||b) this._gyroGotEvent=true;
      this._gyroTarget.x=Math.max(-1,Math.min(1, g/28));
      this._gyroTarget.y=Math.max(-1,Math.min(1, (b-45)/28)); };
    try{ window.addEventListener('deviceorientation', this._gyroHandler, true); }catch(_){}
    const loop=()=>{ const c=this._gyroCur,t=this._gyroTarget;
      // 자이로 이벤트가 안 들어오면(PC·권한 거부) 시간 기반 자동 드리프트로 패럴랙스 유지
      if(!this._gyroGotEvent){ const s=(performance.now()-this._gyroT0)/1000; t.x=Math.sin(s*0.35)*0.6; t.y=Math.cos(s*0.27)*0.5; }
      c.x+=(t.x-c.x)*0.08; c.y+=(t.y-c.y)*0.08;
      // 이동 폭 = 패럴랙스 강도. 2026-08-17 40% 축소(배경 -14/-10 · 전경 34/22 → ×0.6).
      // 최대 기울임 기준 상대 변위 좌우 48→28.8px · 상하 32→19.2px.
      if(this._bootBgEl) this._bootBgEl.style.transform='translate('+(c.x*-8.4).toFixed(2)+'px,'+(c.y*-6).toFixed(2)+'px)';
      if(this._bootFgEl) this._bootFgEl.style.transform='translate('+(c.x*20.4).toFixed(2)+'px,'+(c.y*13.2).toFixed(2)+'px)';
      this._gyroRAF=requestAnimationFrame(loop); };
    this._gyroRAF=requestAnimationFrame(loop); }
  stopGyro(){ if(this._gyroHandler){ try{ window.removeEventListener('deviceorientation', this._gyroHandler, true); }catch(_){}; this._gyroHandler=null; }
    if(this._gyroRAF){ cancelAnimationFrame(this._gyroRAF); this._gyroRAF=null; }
    // 명령형으로 찍힌 잔여 transform 제거 + ref 해제 → DC가 노드 재사용해도 다른 화면이 쏠리지 않음

    this._bootBgEl=null; this._bootFgEl=null; this._gyroOn=false; }
  // 공용 로딩 뷰 (svg screen-boot-loading 기준): 배경 + 하단 그라데이션(이미지 덮개) + 팁(라벨+숫자·본문) + 최하단 풀폭 프로그레스
  // 402 스테이지 스케일 ref (로딩 패럴랙스·태그 단말·패스 충전 공용).
  // ⚠ 명령형으로 넣은 transform은 노드에 눌어붙는다 — DC는 화면이 바뀌어도 DOM 노드를 재사용하므로
  //   지우지 않으면 다음 화면이 그 노드를 물려받아 남은 scale로 확대/축소된다(헤더 좌우 여백 잠식 사고).
  //   게다가 transformOrigin:'0 0'은 vdom 선언이라 리셋되어 center로 돌아가 어긋남이 더 커진다.
  //   → 언마운트(ref(null))에서 transform을 반드시 비운다. key까지 붙여 재사용 자체도 막는다.
  stageRef(name){
    if(!this._stageRefs) this._stageRefs={};
    if(!this._stageRefs[name]){
      const st={el:null};
      this._stageRefs[name]=el=>{
        if(el){ st.el=el; const pw=el.parentElement&&el.parentElement.clientWidth;
          if(pw) el.style.transform='scale('+(pw/402)+')'; }
        else if(st.el){ st.el.style.transform=''; st.el=null; }
      };
    }
    return this._stageRefs[name];
  }
  loadingView(opts){ opts=opts||{};
    return h('div',{onClick:opts.onTap||null,style:{flex:1,position:'relative',overflow:'hidden',background:'#18191D',cursor:opts.onTap?'pointer':'default'}},
      // 패럴랙스 3레이어(부팅): 배경(원경) → 로고(고정) → 몬스터(근경).
      // 좌표는 svg 원본(402x828) 그대로 — 402폭 스테이지를 프레임 폭에 맞춰 균일 스케일(상단 앵커).
      // 스테이지 아래로 남는 띠는 컨테이너 배경(#18191D)이 채운다 — 하단 그라데이션 끝색과 같아 이음매가 없다.
      opts.bg? h('div',{key:'stage402-boot', ref:this.stageRef('boot'),
        style:{position:'absolute',left:0,top:0,width:402,height:828,transformOrigin:'0 0',pointerEvents:'none'}},
        // 원경 — 자이로로 아주 조금 움직인다
        h('div',{ref:opts.bgRef,style:{position:'absolute',inset:0,willChange:'transform'}},
          h('img',{src:opts.bg.src,style:{position:'absolute',left:opts.bg.x,top:opts.bg.y,width:opts.bg.w,height:opts.bg.h,display:'block'}})),

          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',height:24}},

  runGrowthSeq(el){
    if(!el || el._seq) return; el._seq=1;
    this._growthEl=el; this._resAnimating=true; this._resSkip=false;   // 스킵 제어: 연출 진행 중 플래그
    const rows=[...el.querySelectorAll('[data-grow]')].filter(r=>r.getAttribute('data-gain')==='1');  // 성장 안 한 스탯은 스킵(정적 표시)
    // 성장 스탯: 시작 상태(전투 전)로 리셋
    rows.forEach(r=>{
      const num=r.querySelector('[data-num]'), box=r.querySelector('[data-lvlbox]'), fill=r.querySelector('[data-fill]');
      const fromLv=r.getAttribute('data-fl'), fromP=parseFloat(r.getAttribute('data-fp'))||0;
      if(num) num.textContent=fromP.toFixed(2)+'%';
      if(box) box.textContent=String(fromLv);
      if(fill) fill.style.width=fromP+'%';
    });
    if(!rows.length){ this.runSatoCount(el); return; }   // 성장한 스탯 없음 → 바로 사토
    const easeOut=t=>1-Math.pow(1-t,4);   // 뒤로 갈수록 느려짐
    // 힘·민첩·체력·의지 4스탯 동시 연출 (2.5초, 감속). 전부 끝난 뒤 사토.
    const anims=rows.map(row=>{
      const num=row.querySelector('[data-num]'), box=row.querySelector('[data-lvlbox]'), fill=row.querySelector('[data-fill]'), shim=row.querySelector('[data-shimmer]');
      const fromLv=parseInt(row.getAttribute('data-fl'),10)||0, fromP=parseFloat(row.getAttribute('data-fp'))||0;
      const toLv=parseInt(row.getAttribute('data-tl'),10)||0, toP=parseFloat(row.getAttribute('data-tp'))||0;
      const span=(toLv>fromLv)?((100-fromP)+(toLv-fromLv-1)*100+toP):Math.max(0,toP-fromP);
      if(num){ num.style.transition='transform .2s ease-out'; num.style.transform='scale(1.2)'; }
      if(shim) shim.style.animation='rlShimmer 1.4s linear infinite';
      return {num,box,fill,shim,fromLv,fromP,toLv,toP,span,lastLv:fromLv};
    });
    const dur=2500; let st=null;
    const tick=now=>{
      if(this._resSkip) return;
      if(st==null)st=now;
      const t=Math.min(1,(now-st)/dur), f=easeOut(t);
      anims.forEach(a=>{
        let level=a.fromLv, p=a.fromP+a.span*f;
        while(p>=100 && level<a.toLv){ p-=100; level++; }
        if(t>=1){ level=a.toLv; p=a.toP; }
        const pc=Math.max(0,Math.min(100,p));
        if(a.fill) a.fill.style.width=pc+'%';
        if(a.num) a.num.textContent=pc.toFixed(2)+'%';
        if(level!==a.lastLv){ const prev=a.lastLv; a.lastLv=level; this.rollLevel(a.box, prev, level); }
      });
      if(t<1) requestAnimationFrame(tick);
      else{
        anims.forEach(a=>{
          if(a.num){ a.num.textContent=a.toP.toFixed(2)+'%'; a.num.style.transform='scale(1)'; }
          if(a.box) a.box.textContent=String(a.toLv);
          if(a.fill) a.fill.style.width=a.toP+'%';
          if(a.shim) a.shim.style.animation='';
        });
        setTimeout(()=>this.runSatoCount(el), 220);   // 4스탯 전부 끝난 뒤 사토 연출
      }
    };
    requestAnimationFrame(tick);
  }
  rollLevel(box, from, to){
    if(!box) return;
    box.textContent='';
    const strip=document.createElement('span');
    strip.style.display='block'; strip.style.transform='translateY(0)';
    const mk=v=>{ const s=document.createElement('span'); s.style.display='block'; s.style.height='12px'; s.style.lineHeight='12px'; s.textContent=String(v); return s; };
    strip.appendChild(mk(from)); strip.appendChild(mk(to));
    box.appendChild(strip);
    void strip.offsetWidth;
    strip.style.transition='transform .32s cubic-bezier(.2,.85,.2,1)';
    strip.style.transform='translateY(-12px)';
  }

      h('div',{style:{position:'relative',display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,paddingTop:12,borderTop:'1px solid '+LN}},
        h('span',{style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.8px',color:MUT}}, this.en()?'VAULT':'금고'),

  runSatoCount(statEl){
    const box = statEl && statEl.parentNode && statEl.parentNode.querySelector('[data-sato]');
    if(!box){ this._resAnimating=false; return; }   // 사토 보상 없음 → 연출 종료
    if(box._sato) return; box._sato=1;

  animRecover(fillEl,numEl,barEl,startVal,endVal,maxVal){
    return new Promise(resolve=>{
      if(!fillEl){ resolve(); return; }
      const startPct=maxVal>0?Math.max(0,Math.min(100,startVal/maxVal*100)):0;
      const endPct=maxVal>0?Math.max(0,Math.min(100,endVal/maxVal*100)):0;   // 수리는 부분 회복(≠100%)도 가능

        fillEl.style.width=(startPct+(endPct-startPct)*f)+'%';
        if(numEl) numEl.textContent=Math.round(startVal+(endVal-startVal)*f)+' / '+Math.round(maxVal);
        if(t<1) requestAnimationFrame(tick);
        else{
          fillEl.style.width=endPct+'%';
          if(numEl) numEl.textContent=Math.round(endVal)+' / '+Math.round(maxVal);
          if(barEl){ barEl.classList.remove('rcv-on'); barEl.classList.add('rcv-done'); setTimeout(()=>{ if(barEl) barEl.classList.remove('rcv-done'); },520); }
          resolve();

  // ===== 프로토콜 패스 — 출정 1회 = 패스 1회 소모(존 무관). 인벤토리에 없는 안전가옥 자산 =====
  // 밸런스 값은 전부 Config 탭에서 조정한다(코드 값은 시트 미로드 시 폴백).
  passCap(){ return Math.max(1, this.eng.N(this.eng.DATA.config.pass_cap, 50)); }
  passThreshold(){ return Math.max(0, this.eng.N(this.eng.DATA.config.pass_auto_threshold, 10)); }
  passRegenMs(){ return Math.max(1, this.eng.N(this.eng.DATA.config.pass_regen_minutes, 10))*60000; }
  // 회당 정액. 수량 할인 폐지(2026-08-17) — 구 pass_price_5/10/20은 Config에서 Deprecated.
  passPricePer(){ return Math.max(0, this.eng.N(this.eng.DATA.config.pass_price_per, 500)); }
  passPrice(qty){ return this.passPricePer()*Math.max(0,qty|0); }
  // 패스는 출정과 무관한 안전가옥 자산이라 런 세이브(rl_save_v1)와 **별도 키**에 즉시 저장한다.
  // 런 세이브는 출정 중 잠기기 때문에(inSortie 가드), 거기 얹으면 출정 직후 앱을 껐다 켰을 때 차감이 되돌아간다.
  savePass(){ const g=this.gs; if(!g) return; try{ localStorage.setItem('rl_pass_v1', JSON.stringify({pass:g.pass, passAt:g.passAt})); }catch(_){ } }
  readPass(){ try{ const s=localStorage.getItem('rl_pass_v1'); if(!s) return null; const o=JSON.parse(s); return (o && typeof o.pass==='number') ? o : null; }catch(_){ return null; } }
  // 별도 키가 있으면 그 값이 이긴다(세이브 초기화·처음부터 시작해도 패스는 유지 — 고정 자산).
  loadPass(){ const g=this.gs; const p=this.readPass();
    if(p){ g.pass=Math.max(0,Math.min(this.passCap(),this.eng.N(p.pass,0))); g.passAt=this.eng.N(p.passAt,Date.now()); }
    else { if(g.pass==null) g.pass=this.passThreshold(); if(!g.passAt) g.passAt=Date.now(); this.savePass(); } }
  // 실시간 경과분 정산. 보유가 threshold 이하일 때만 regen 간격마다 1회씩, threshold까지만 채운다.
  passTick(){
    const g=this.gs; if(!g) return;
    if(g.pass==null) g.pass=this.passThreshold();
    const now=Date.now(), th=this.passThreshold(), per=this.passRegenMs();
    if(!g.passAt) g.passAt=now;
    if(g.pass>=th){ if(g.passAt!==now){ g.passAt=now; this.savePass(); } return; }   // 충전 대기 없음 — 기준 시각만 따라옴
    const gained=Math.floor((now-g.passAt)/per);
    if(gained>0){ g.pass=Math.min(th, g.pass+gained); g.passAt = g.pass>=th ? now : g.passAt+gained*per; this.savePass(); }
  }
  passLeftMs(){ const g=this.gs; if(!g||g.pass>=this.passThreshold()) return 0; return Math.max(0, this.passRegenMs()-(Date.now()-(g.passAt||Date.now()))); }
  passBuy(n){
    const g=this.gs, cost=this.passPrice(n), cap=this.passCap();
    if(g.pass+n>cap){ this.flash(this.en()?'Over the pass limit':'보유 한도를 넘습니다'); return false; }
    if(g.sato<cost){ this.flash(this.t('shop_insufficient_sato')); return false; }
    g.sato-=cost; g.pass+=n; this.savePass(); this.saveGame(); this.forceUpdate();
    return true;
  }
  // 출정 시 1회 차감. TODO: 결제(태그) 연출을 만들면 그 트리거로 옮긴다.
  // savePass()는 출정 중에도 쓰이므로 여기서 즉시 확정된다(재시작해도 되돌아가지 않음).
  usePass(){ this.passTick(); const g=this.gs; if(g.pass<=0) return false;
    g.pass--; if(g.pass<this.passThreshold()) g.passAt=Date.now(); this.savePass(); this.saveGame(); return true; }
  // 재화 칩 — 인벤토리·출정·안전가옥 우측 상단 공용. PASS(호박) + SATO. PASS 탭 시 패스 화면.
  currencyChips(){
    this.passTick();
    const g=this.gs, AM='#C19E6F';
    const wrap=(kids,on)=>h('div',{onClick:on||null,style:{display:'flex',alignItems:'center',gap:6,background:T.s2,border:'1px solid '+T.line,borderRadius:3,padding:'4px 8px',cursor:on?'pointer':'default'}},...kids);
    return h('div',{style:{display:'flex',alignItems:'center',gap:6,flex:'0 0 auto'}},
      wrap([this.chip('PASS',AM),
            h('span',{style:{fontFamily:T.mono,fontWeight:500,fontSize:12,color:AM}}, g.pass+'/'+this.passCap()),

           ()=>{ this._passFrom=this.state.screen; this._passQty=1; this._passPhase='insert'; this.go('pass'); }),
      wrap([this.chip('SATO',T.sato),
            h('span',{style:{fontFamily:T.mono,fontWeight:500,fontSize:12,color:T.sato}}, g.sato.toLocaleString())]));
  }

  // 키카드 존(경찰서 등)은 프로토콜 패스를 쓰지 않는다 — 키카드 1장을 삽입(1회용)하고 나간다.

    return h('div',{style:{flex:1,position:'relative',overflow:'hidden',background:'#111315'}},
      // 402 기준 스테이지(터미널·카드) — 상단 고정 스케일

        // LED 28×28 — 아웃글로우(색) + 이너글로우(흰색)

  // ===== 프로토콜 패스 충전 화면 (screen-protocol-pass-{default,sato,max,done}.svg · 402x828) =====
  // 상단 = 카드 + 단말 고정 아트(연출 없음), 하단 = 시트. 태그 화면과 같은 402 스테이지 스케일.
  // 상태 4종은 하단 안내 박스 + LCD 밝기 + 충전 버튼 활성으로만 갈린다.
  passQtyMax(){ return Math.max(1, this.passCap()-this.gs.pass); }
  passQty(){ return Math.max(1, Math.min(this.passQtyMax(), this._passQty||1)); }
  passSetQty(d){ this._passQty=Math.max(1, Math.min(this.passQtyMax(), this.passQty()+d)); this.forceUpdate(); }
  // LCD 우측 카운터·게이지는 충전 직후 한 칸씩 카운트업(1회는 즉시). _passShown이 null이면 실제 보유값.
  passCountUp(from,to){
    clearInterval(this._passUpT); this._passUpT=null;
    if(to-from<=1){ this._passShown=null; this.forceUpdate(); return; }
    this._passShown=from;
    this._passUpT=setInterval(()=>{
      if(this.state.screen!=='pass'){ clearInterval(this._passUpT); this._passUpT=null; this._passShown=null; return; }
      this._passShown++;
      if(this._passShown>=to){ this._passShown=null; clearInterval(this._passUpT); this._passUpT=null; }
      this.forceUpdate();
    },90);
  }
  // 카드 삽입 3단계: insert(카드 내려와 있음) -> loading(꽂힘·LOADING 1.5초) -> null(평상 화면).
  // 뽑는 연출은 없다 — 화면을 나가면 다음 진입 때 다시 insert부터.
  passInsert(){
    if(this._passPhase!=='insert') return;
    this._passPhase='loading'; this.forceUpdate();
    this.sfx('card_insert');
    clearTimeout(this._passPhT);
    this._passPhT=setTimeout(()=>{
      if(this.state.screen!=='pass'){ this._passPhT=null; return; }
      // 여기서 LOADING 점멸이 끝난다 = 카드를 다 읽은 시점 → 완료음
      this.sfx('tap_terminal_done');
      this._passPhase=null; this._passPhT=null; this.forceUpdate(); },1500);

  doPassBuy(){
    if(this._passPhase) return;                              // 카드를 읽기 전에는 충전 불가

    if(!this.passBuy(qty)) return;
    this._passQty=1;
    this.passCountUp(before, this.gs.pass);
    // 충전 중 0.5초만 버튼을 잠근다(연타 방지). 상시 비활성은 50/50일 때뿐.
    this._passBusy=true; clearTimeout(this._passBusyT);
    this._passBusyT=setTimeout(()=>{ this._passBusy=false; this.forceUpdate(); },500);
    this._passDone=true; clearTimeout(this._passDoneT);
    this._passDoneT=setTimeout(()=>{ this._passDone=false; this.forceUpdate(); },2000);
    this.forceUpdate();
  }
  passScreen(){
    this.passTick();
    const g=this.gs, cap=this.passCap(), th=this.passThreshold();
    const phase=this._passPhase;                            // 'insert' | 'loading' | null(평상)
    // 남은 시간 1초 갱신 — 화면 떠 있는 동안만 타이머 유지
    if(!this._passT) this._passT=setInterval(()=>{
      if(this.state.screen!=='pass'){ clearInterval(this._passT); this._passT=null; return; }
      this.forceUpdate(); },1000);
    const shown = (this._passShown==null) ? g.pass : this._passShown;
    const qty=this.passQty(), per=this.passPricePer(), cost=per*qty;
    const full=g.pass>=cap, short=g.sato<cost, atMax=g.pass+qty>=cap;
    const regen=g.pass<th;                                  // 자동 충전이 도는 구간에서만 LCD 좌측이 밝다
    const GRN='#30D322', DIM='#096E00', AM='#CCA26E';
    const mm=(ms)=>{ const s=Math.ceil(ms/1000); return [String(Math.floor(s/60)).padStart(2,'0'), String(s%60).padStart(2,'0')]; };
    const t=regen?mm(this.passLeftMs()):['00','00'];
    const lcdC=regen?GRN:DIM;
    // 안내 박스 — 충전 완료 > 사토 부족 > 상한 도달 > 기본 안내
    const note = (this._passDone||full) ? {t:(this.en()?'Charge complete.':'충전이 완료되었습니다.'), c:'#83B289'}
               : short ? {t:(this.en()?'Not enough Sato.':'사토가 부족합니다.'), c:AM}
               : atMax ? {t:(this.en()?('Charge limit '+cap):('최대 충전 제한 '+cap+'회')), c:AM}
               : {t:(this.en()? (th+' or fewer recharges every '+Math.round(this.passRegenMs()/60000)+'m')
                              : (th+'회 이하일 때 '+Math.round(this.passRegenMs()/60000)+'분 마다 자동 충전')), c:'#6B6B6B'};
    const canBuy = !full && !this._passBusy;
    // 스테퍼 — 치수·색은 상점 qstepper/fstepper 규격(30x30 · radius 4 · #4a4d53), 글리프만 svg 셰브론
    const step=(dir,on)=>h('div',{key:'st'+dir, onClick:on?()=>this.passSetQty(dir):null,
      style:{width:30,height:30,boxSizing:'border-box',border:'1px solid #4a4d53',borderRadius:4,
